<!-- VPM Newsletters — Inline CTA banner -->
<!-- No id attributes anywhere: this block may be placed more than once on a
     page, and duplicate ids are invalid and confuse screen readers. -->
<section class="vpm-nlcta">
  <div class="vpm-nlcta__bar" aria-hidden="true"></div>

  <div class="vpm-nlcta__row">
    <div class="vpm-nlcta__copy">
      <p class="vpm-nlcta__eyebrow">VPM Newsletters</p>
      <h2 class="vpm-nlcta__title">Get VPM stories in your inbox</h2>
      <p class="vpm-nlcta__body">
        Choose from Morning Monitor, Weekly Update, Virginia Home Grown and more —
        local news and can't-miss content, delivered on your schedule.
      </p>
    </div>

    <a class="vpm-nlcta__link" href="https://www.vpm.org/stay-connected-to-what-matters">
      Sign up for newsletters
      <span class="vpm-nlcta__arrow" aria-hidden="true">&rarr;</span>
    </a>
  </div>
</section>
