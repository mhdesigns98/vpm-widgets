<!-- VPM 2026 Elections — CTA -->
<!-- No id attributes anywhere: this block may be placed more than once on a
     page, and duplicate ids are invalid and confuse screen readers. -->
<section class="vpm-elec26cta" data-module="promo-large">
  <div class="vpm-elec26cta__bar" aria-hidden="true"></div>

  <div class="vpm-elec26cta__grid">

    <!-- Media: swap the src for a VPM-owned photo. Remove this <figure> entirely
         and the panel fills the full width with no layout break. -->
    <figure class="vpm-elec26cta__media">
      <img
        class="vpm-elec26cta__img"
        src="https://placehold.co/1200x800/003865/FFFFFF?text=Swap+in+VPM+photo"
        alt=""
        loading="lazy"
        decoding="async"
        width="1200"
        height="800"
      />
    </figure>

    <div class="vpm-elec26cta__panel">
      <p class="vpm-elec26cta__eyebrow">VPM News &middot; Election Coverage</p>

      <h2 class="vpm-elec26cta__title">
        Virginia's 2026 general election
      </h2>

      <p class="vpm-elec26cta__body">
        Virginians elect a U.S. senator and all 11 members of the U.S. House on Tuesday,
        Nov. 3. VPM News has what's on your ballot, where and when to vote, and live
        results after polls close at 7 p.m.
      </p>

      <a class="vpm-elec26cta__link" href="https://vpm.org/elections" data-module="promo-large" data-module-position="1">
        Explore our coverage
        <span class="vpm-elec26cta__arrow" aria-hidden="true">&rarr;</span>
      </a>
    </div>

  </div>
</section>
