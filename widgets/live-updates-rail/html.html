<!-- Live Updates Rail -->
<!-- No id attributes anywhere: this block may be placed more than once on a
     page, and duplicate ids are invalid and confuse screen readers. -->
<div class="vpm-lur" data-density="comfortable">

  <div class="vpm-lur__header">
    <h3 class="vpm-lur__title">Latest Updates</h3>
    <p class="vpm-lur__dek">Short dispatches from VPM reporters — the things we're watching before there's a full story.</p>
    <p class="vpm-lur__updated" data-lur-updated>Updated just now</p>
  </div>
  <div class="vpm-lur__bar" aria-hidden="true"></div>

  <div class="vpm-lur__list" data-lur-list></div>

  <div class="vpm-lur__footer">
    <button type="button" class="vpm-lur__loadmore" data-lur-loadmore hidden>Load more updates</button>
    <a class="vpm-lur__seeall" href="#" data-lur-seeall>See all updates</a>
  </div>

</div>
