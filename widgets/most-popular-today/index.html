<div class="vpm-mpt">
  <style>
    .vpm-mpt {
      --vpm-dark-blue:  #003865;
      --vpm-yellow:     #E0E721;
      --vpm-gray-900:   #1A1F26;
      --vpm-gray-600:   #5A6470;
      --vpm-gray-200:   #E5E7E9;
      --font-sans:    'Public Sans', 'GT America', 'Helvetica Neue', Arial, sans-serif;
      --fs-eyebrow:   13px;
      --fs-body-sm:   14px;
      --lh-normal:    1.45;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;

      font-family: var(--font-sans);
      border-top: 3px solid var(--vpm-yellow);
      padding: var(--space-4) 0 0;
    }

    .vpm-mpt__eyebrow {
      font-size: var(--fs-eyebrow);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--vpm-dark-blue);
      margin: 0 0 var(--space-3);
    }

    .vpm-mpt__list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .vpm-mpt__item {
      border-bottom: 1px solid var(--vpm-gray-200);
    }

    .vpm-mpt__item:last-child { border-bottom: none; }

    .vpm-mpt__link {
      display: flex;
      gap: var(--space-3);
      align-items: baseline;
      padding: var(--space-3) 0;
      text-decoration: none;
      color: var(--vpm-gray-900);
      line-height: var(--lh-normal);
    }

    .vpm-mpt__link:hover .vpm-mpt__title,
    .vpm-mpt__link:focus-visible .vpm-mpt__title {
      color: var(--vpm-dark-blue);
      text-decoration: underline;
    }

    .vpm-mpt__link:focus-visible {
      outline: 2px solid var(--vpm-dark-blue);
      outline-offset: 2px;
    }

    .vpm-mpt__rank {
      font-weight: 700;
      font-size: var(--fs-body-sm);
      color: var(--vpm-gray-600);
      flex: 0 0 auto;
    }

    .vpm-mpt__title {
      font-size: var(--fs-body-sm);
      font-weight: 600;
    }

    .vpm-mpt__status {
      font-size: var(--fs-body-sm);
      color: var(--vpm-gray-600);
      padding: var(--space-2) 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .vpm-mpt * { transition: none !important; }
    }
  </style>

  <p class="vpm-mpt__eyebrow">Most Popular Today</p>
  <ul class="vpm-mpt__list" data-vpm-mpt-list>
    <li class="vpm-mpt__status">Loading trending stories&hellip;</li>
  </ul>
</div>

<script>
(function () {
  // TODO: replace with the real proxy endpoint once the Chartbeat data source
  // is resolved (see BRIEF.md open questions — likely a CF Worker extending
  // chartbeat-weekly rather than calling Chartbeat directly, to avoid exposing
  // the API key client-side).
  var ENDPOINT = 'https://REPLACE-ME.workers.dev/most-popular';
  var CACHE_KEY = 'vpm-mpt-cache';
  var CACHE_MS = 15 * 60 * 1000; // 15 min, adjust per brief's open question

  var root = document.currentScript.previousElementSibling;
  if (!root || !root.classList.contains('vpm-mpt')) return;
  var listEl = root.querySelector('[data-vpm-mpt-list]');

  function render(stories) {
    if (!stories || !stories.length) {
      listEl.innerHTML = '<li class="vpm-mpt__status">No trending stories right now.</li>';
      return;
    }
    listEl.innerHTML = stories.slice(0, 5).map(function (story, i) {
      var rank = i + 1;
      var url = String(story.url || '#');
      var title = String(story.title || '');
      return '<li class="vpm-mpt__item">' +
        '<a class="vpm-mpt__link" href="' + encodeURI(url) + '">' +
          '<span class="vpm-mpt__rank" aria-hidden="true">' + rank + '</span>' +
          '<span class="vpm-mpt__title">' + title.replace(/</g, '&lt;') + '</span>' +
        '</a>' +
      '</li>';
    }).join('');
  }

  function fromCache() {
    try {
      var raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (Date.now() - parsed.ts > CACHE_MS) return null;
      return parsed.stories;
    } catch (e) {
      return null;
    }
  }

  function toCache(stories) {
    try {
      sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), stories: stories }));
    } catch (e) { /* storage unavailable, skip caching */ }
  }

  var cached = fromCache();
  if (cached) {
    render(cached);
    return;
  }

  fetch(ENDPOINT)
    .then(function (res) {
      if (!res.ok) throw new Error('bad response');
      return res.json();
    })
    .then(function (data) {
      var stories = data && data.stories ? data.stories : [];
      toCache(stories);
      render(stories);
    })
    .catch(function () {
      listEl.innerHTML = '<li class="vpm-mpt__status">Unable to load trending stories.</li>';
    });
})();
</script>
