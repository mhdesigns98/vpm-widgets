<div class="vpm-mpt">
  <style>
    .vpm-mpt {
      --vpm-dark-blue:  #003865;
      --vpm-blue-700:   #003865;
      --vpm-blue-900:   #002244;
      --vpm-yellow:     #E0E721;
      --vpm-white:      #FFFFFF;
      --vpm-gray-900:   #1A1F26;
      --vpm-gray-600:   #5A6470;
      --vpm-gray-200:   #E5E7E9;
      --font-sans:    'Public Sans', 'GT America', 'Helvetica Neue', Arial, sans-serif;
      --fs-eyebrow:   13px;
      --fs-body:      16px;
      --fs-body-sm:   14px;
      --lh-normal:    1.45;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;

      /* Color roles. The hero-theme blocks at the end of this style only
         change these, never the rules that use them. */
      --mpt-rule:       var(--vpm-yellow);
      --mpt-top-rule:   3px solid var(--mpt-rule);
      --mpt-eyebrow:    var(--vpm-dark-blue);
      --mpt-link:       var(--vpm-blue-700);
      --mpt-link-hover: var(--vpm-blue-900);
      --mpt-rank:       var(--vpm-gray-600);
      --mpt-divider:    var(--vpm-gray-200);
      --mpt-focus:      var(--vpm-dark-blue);

      font-family: var(--font-sans);
      border-top: var(--mpt-top-rule);
      margin: 0;
      padding: var(--space-4) 0 0;
    }

    .vpm-mpt__eyebrow {
      font-size: var(--fs-eyebrow);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--mpt-eyebrow);
      margin: 0 0 var(--space-3);
    }

    .vpm-mpt__list {
      list-style: none;
      margin: 0;
      padding: 0;
      /* No internal scroll: a nested scrollable list inside an already-
         scrolling page traps mobile swipe gestures, which is worse than
         occasionally sitting near a sticky element. Full height instead —
         verify against the real page layout post-deploy (see HANDOFF.md). */
    }

    .vpm-mpt__item {
      margin: 0;
      padding: 0;
      border-bottom: 1px solid var(--mpt-divider);
    }

    .vpm-mpt__item:last-child { border-bottom: none; }

    .vpm-mpt__item--top {
      border-bottom: 2px solid var(--mpt-rule);
      padding-bottom: var(--space-2);
    }

    .vpm-mpt.vpm-mpt .vpm-mpt__link {
      display: flex;
      gap: var(--space-3);
      align-items: baseline;
      padding: var(--space-3) 0;
      line-height: var(--lh-normal);
      /* Only the title is underlined. Without this the browser's (or a
         host's) link underline and color also land on the rank numeral. */
      color: var(--mpt-link) !important;
      text-decoration: none !important;
    }

    /* Link at rest reads as a link: VPM's own base <a> convention is
       colored + underlined at rest, not just on hover (see tokens.css).
       The widget previously hid this behind hover-only styling, which is
       why the title read as plain text until interaction. */
    .vpm-mpt.vpm-mpt .vpm-mpt__link .vpm-mpt__title {
      color: var(--mpt-link) !important;
      text-decoration: underline !important;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .vpm-mpt.vpm-mpt .vpm-mpt__link:hover .vpm-mpt__title,
    .vpm-mpt.vpm-mpt .vpm-mpt__link:focus-visible .vpm-mpt__title {
      color: var(--mpt-link-hover) !important;
    }

    .vpm-mpt__link:focus-visible {
      outline: 2px solid var(--mpt-focus);
      outline-offset: 2px;
    }

    .vpm-mpt__rank {
      font-weight: 700;
      font-size: var(--fs-body-sm);
      color: var(--mpt-rank);
      flex: 0 0 auto;
    }

    .vpm-mpt__title {
      font-size: var(--fs-body);
      font-weight: 600;
    }

    .vpm-mpt__item--top .vpm-mpt__title {
      font-weight: 700;
    }

    .vpm-mpt__status {
      font-size: var(--fs-body-sm);
      color: var(--mpt-rank);
      padding: var(--space-2) 0;
    }

    /* ---- Homepage hero presets (wpp-base homepage-extras.css) ----
       The hero adds .hero-theme-election / -breaking / -pledge to
       .hero-section; no class is the standard white hero. Colors match
       that file, which owns them: red and gold are the theme's values,
       not tokens.css (theme-owned exception, see README). Contrast
       (text on background): election links #fff on #003865 12:1, rank
       8.2:1; pledge rank #5A6470 on #fff8e8 5.7:1. */

    /* The theme paints the code-block wrapper white. Clear it only for
       the box holding this widget, so the hero color shows through. */
    [class*="hero-theme-"] .page-code-block:has(.vpm-mpt) {
      background: transparent;
    }

    .hero-theme-election .vpm-mpt {
      --mpt-eyebrow:    var(--vpm-white);
      --mpt-link:       var(--vpm-white);
      --mpt-link-hover: var(--vpm-yellow);
      --mpt-rank:       rgba(255, 255, 255, 0.8);
      --mpt-divider:    rgba(255, 255, 255, 0.2);
      --mpt-focus:      var(--vpm-yellow);
    }

    /* Breaking and pledge already draw a full-width accent rule across
       the hero grid, so the widget drops its own to avoid a double line. */
    .hero-theme-breaking .vpm-mpt,
    .hero-theme-pledge .vpm-mpt {
      --mpt-top-rule:   none;
    }

    .hero-theme-breaking .vpm-mpt {
      --mpt-rule:       var(--red, #c8102e);
      --mpt-link-hover: var(--red, #c8102e);
    }

    .hero-theme-pledge .vpm-mpt {
      --mpt-rule:       #f2a900;
      --mpt-link-hover: #7a5200;
      --mpt-divider:    rgba(16, 24, 32, 0.12);
    }

    @media (prefers-reduced-motion: reduce) {
      .vpm-mpt * { transition: none !important; }
    }
  </style>

  <p class="vpm-mpt__eyebrow">Most Popular Today</p>
  <ul class="vpm-mpt__list" data-vpm-mpt-list>
    <li class="vpm-mpt__status">Loading trending stories&hellip;</li>
  </ul>
</div>

<script>
(function () {
  // Public endpoint on the chartbeat-weekly Worker — see apiMostPopular() in
  // that repo's src/index.js. Calls Chartbeat's synchronous toppages API
  // server-side so the API key never reaches the browser.
  var ENDPOINT = 'https://chartbeat-weekly.vpm-e01.workers.dev/api/most-popular';
  var CACHE_KEY = 'vpm-mpt-cache';
  // Matches the Worker's own 5-min in-isolate cache — no benefit to caching
  // longer client-side since the server won't return fresher data anyway.
  var CACHE_MS = 5 * 60 * 1000;

  var root = document.currentScript.previousElementSibling;
  if (!root || !root.classList.contains('vpm-mpt')) return;
  var listEl = root.querySelector('[data-vpm-mpt-list]');

  function render(stories) {
    if (!stories || !stories.length) {
      listEl.innerHTML = '<li class="vpm-mpt__status">No trending stories right now.</li>';
      return;
    }
    listEl.innerHTML = stories.slice(0, 5).map(function (story, i) {
      var rank = i + 1;
      var url = String(story.url || '#');
      var title = String(story.title || '');
      var itemClass = rank === 1 ? 'vpm-mpt__item vpm-mpt__item--top' : 'vpm-mpt__item';
      return '<li class="' + itemClass + '">' +
        '<a class="vpm-mpt__link" href="' + encodeURI(url) + '">' +
          '<span class="vpm-mpt__rank" aria-hidden="true">' + rank + '</span>' +
          '<span class="vpm-mpt__title">' + title.replace(/</g, '&lt;') + '</span>' +
        '</a>' +
      '</li>';
    }).join('');
  }

  function fromCache() {
    try {
      var raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (Date.now() - parsed.ts > CACHE_MS) return null;
      return parsed.stories;
    } catch (e) {
      return null;
    }
  }

  function toCache(stories) {
    try {
      sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), stories: stories }));
    } catch (e) { /* storage unavailable, skip caching */ }
  }

  var cached = fromCache();
  if (cached) {
    render(cached);
    return;
  }

  fetch(ENDPOINT)
    .then(function (res) {
      if (!res.ok) throw new Error('bad response');
      return res.json();
    })
    .then(function (data) {
      var stories = data && data.stories ? data.stories : [];
      toCache(stories);
      render(stories);
    })
    .catch(function () {
      listEl.innerHTML = '<li class="vpm-mpt__status">Unable to load trending stories.</li>';
    });
})();
</script>
