<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPM Banner — Preview</title>
  <style>
    body { margin: 0; background: #f0f2f4; font-family: system-ui, sans-serif; padding: 32px 0; }
    .preview-label {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b6b6b;
      margin-bottom: 16px;
    }
    /* Tokens copied from tokens.css (scoped, not linked) */
    .vpm-banner {
      --vpm-dark-blue: #003865;
      --vpm-yellow: #E0E721;
      --vpm-yellow-200: #F2F5A2;
      --vpm-black: #101820;
      --vpm-white: #FFFFFF;
      --vpm-light-blue: #6CACE4;
      --font-sans: 'Public Sans', 'GT America', 'Helvetica Neue', Arial, sans-serif;
      --radius-md: 4px;
      --shadow-xs: 0 1px 2px rgba(16, 24, 32, 0.06);
      --dur-base: 200ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);

      box-sizing: border-box;
      position: relative;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 96px;
      margin: 0 0 32px;
      padding: 16px 56px;
      background-color: var(--vpm-dark-blue);
      color: var(--vpm-white);
      font-family: var(--font-sans);
      box-shadow: var(--shadow-xs);
    }

    .vpm-banner *,
    .vpm-banner *::before,
    .vpm-banner *::after {
      box-sizing: border-box;
    }

    .vpm-banner[hidden] {
      display: none !important;
    }

    .vpm-banner .vpm-banner__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 960px;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .vpm-banner .vpm-banner__text {
      margin: 0;
      color: var(--vpm-white);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
    }

    /* !important on the link: host themes commonly force color/underline on every `a` */
    .vpm-banner a.vpm-banner__button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 8px 20px;
      white-space: nowrap;
      border-radius: var(--radius-md);
      background-color: var(--vpm-yellow);
      color: var(--vpm-black) !important;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      text-decoration: none !important;
      transition: background-color var(--dur-base) var(--ease-standard);
    }

    .vpm-banner a.vpm-banner__button:hover {
      background-color: var(--vpm-yellow-200);
      color: var(--vpm-black) !important;
    }

    .vpm-banner .vpm-banner__close {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: var(--radius-md);
      background: none;
      color: var(--vpm-white);
      font-family: var(--font-sans);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color var(--dur-base) var(--ease-standard);
    }

    .vpm-banner .vpm-banner__close:hover {
      color: var(--vpm-yellow-200);
    }

    .vpm-banner .vpm-banner__close:focus-visible,
    .vpm-banner a.vpm-banner__button:focus-visible {
      outline: 3px solid var(--vpm-light-blue);
      outline-offset: 2px;
    }

    .vpm-banner .vpm-banner__sr {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 640px) {
      .vpm-banner .vpm-banner__content {
        flex-direction: row;
        gap: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .vpm-banner a.vpm-banner__button,
      .vpm-banner .vpm-banner__close {
        transition: none;
      }
    }
  </style>
</head>
<body>

<p class="preview-label">VPM Banner — dismisses for 3 days via localStorage</p>

<div class="vpm-banner" role="region" aria-label="Support VPM">
  <div class="vpm-banner__content">
    <p class="vpm-banner__text">
      <strong>Federal funding was revoked.</strong> Your support keeps VPM strong.
    </p>
    <a
      href="https://www.pledgecart.org/?campaign=5D84E787-B482-4661-A488-C988BEEB0773"
      class="vpm-banner__button"
      target="_blank"
      rel="noopener noreferrer"
    >
      Donate now<span class="vpm-banner__sr"> (opens in a new tab)</span>
    </a>
  </div>
  <button type="button" class="vpm-banner__close" aria-label="Close banner">×</button>
</div>

<script>
(function () {
  var bannerKey = "vpmBannerDismissed";
  var hideDurationDays = 3;

  function dismissedRecently() {
    try {
      var dismissedAt = parseInt(localStorage.getItem(bannerKey), 10);
      return !isNaN(dismissedAt) &&
        new Date().getTime() < dismissedAt + hideDurationDays * 24 * 60 * 60 * 1000;
    } catch (e) {
      return false;
    }
  }

  function init(banner) {
    if (banner.getAttribute("data-vpm-banner-ready")) return;
    banner.setAttribute("data-vpm-banner-ready", "1");

    if (dismissedRecently()) {
      banner.hidden = true;
      return;
    }

    var closeBtn = banner.querySelector(".vpm-banner__close");
    if (!closeBtn) return;
    closeBtn.addEventListener("click", function () {
      banner.hidden = true;
      try {
        localStorage.setItem(bannerKey, String(new Date().getTime()));
      } catch (e) {}
    });
  }

  var banners = document.querySelectorAll(".vpm-banner");
  for (var i = 0; i < banners.length; i++) init(banners[i]);
})();
</script>
</body>
</html>
