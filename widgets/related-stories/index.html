<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Related Stories</title>
</head>
<body>

<!-- ===== Paste from here into the article template Code Block ===== -->
<aside class="vpm-rel" aria-label="Related stories" data-state="loading">
  <h2 class="vpm-rel__heading">Related stories</h2>
  <ul class="vpm-rel__list" role="list">
    <!-- items rendered by script -->
  </ul>
</aside>

<style>
  .vpm-rel {
    /* Tokens copied from tokens.css (scoped, not :root) */
    --vpm-rel-dark-blue: #003865;
    --vpm-rel-blue-900: #002244;
    --vpm-rel-light-blue: #6CACE4;
    --vpm-rel-black: #101820;
    --vpm-rel-gray-600: #5A6470;
    --vpm-rel-gray-200: #E5E7E9;
    --vpm-rel-white: #FFFFFF;
    --vpm-rel-font-sans: 'Public Sans', 'GT America', 'Helvetica Neue', Arial, sans-serif;
    --vpm-rel-fs-h4: 18px;
    --vpm-rel-fs-body: 16px;
    --vpm-rel-fs-body-sm: 14px;
    --vpm-rel-fs-caption: 12px;
    --vpm-rel-fs-eyebrow: 13px;
    --vpm-rel-lh-snug: 1.2;
    --vpm-rel-lh-normal: 1.45;
    --vpm-rel-tracking-eyebrow: 0.12em;
    --vpm-rel-space-2: 8px;
    --vpm-rel-space-3: 12px;
    --vpm-rel-space-4: 16px;
    --vpm-rel-space-5: 24px;
    --vpm-rel-radius-sm: 2px;
    --vpm-rel-shadow-focus: 0 0 0 3px rgba(108, 172, 228, 0.55);
    --vpm-rel-ease: cubic-bezier(0.2, 0, 0, 1);
    --vpm-rel-dur-fast: 120ms;
    /* Sticky offset: clears site header. TODO: measure on a live article. */
    --vpm-rel-sticky-top: 96px;

    box-sizing: border-box;
    font-family: var(--vpm-rel-font-sans);
    color: var(--vpm-rel-black);
    background: var(--vpm-rel-white);
    border-top: 4px solid var(--vpm-rel-dark-blue);
    padding: var(--vpm-rel-space-4) 0;
    max-width: 100%;
  }
  .vpm-rel *, .vpm-rel *::before, .vpm-rel *::after { box-sizing: inherit; }

  @media (min-width: 1024px) {
    .vpm-rel {
      position: sticky;
      top: var(--vpm-rel-sticky-top);
    }
  }

  .vpm-rel .vpm-rel__heading {
    margin: 0 0 var(--vpm-rel-space-3);
    font-family: var(--vpm-rel-font-sans);
    font-size: var(--vpm-rel-fs-eyebrow);
    font-weight: 700;
    line-height: var(--vpm-rel-lh-snug);
    letter-spacing: var(--vpm-rel-tracking-eyebrow);
    text-transform: uppercase;
    color: var(--vpm-rel-dark-blue);
  }

  .vpm-rel .vpm-rel__list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .vpm-rel[data-state="hidden"] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .vpm-rel, .vpm-rel * { transition: none !important; animation: none !important; }
  }
</style>

<script>
(function () {
  var root = document.currentScript && document.currentScript.previousElementSibling
    && document.currentScript.previousElementSibling.previousElementSibling;
  if (!root || !root.classList.contains('vpm-rel') || root.dataset.vpmRelInit) return;
  root.dataset.vpmRelInit = '1';

  // TODO: read post ID from body class, fetch tags, fetch 4 related posts,
  // fall back to category, render, handle empty/error states.
})();
</script>
<!-- ===== End paste ===== -->

</body>
</html>
