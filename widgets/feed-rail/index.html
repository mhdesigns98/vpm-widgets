<!--
  VPM Feed Rail
  Reusable stream of short updates (video, links, quick items) for placement
  alongside a main story or on a landing page. Content lives entirely in the
  FEED_ITEMS array in the <script> block below — no code changes needed
  beyond editing that list.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VPM Feed Rail</title>
<style>
  .vpm-feedrail {
    --vpm-dark-blue:  #003865;
    --vpm-light-blue: #6CACE4;
    --vpm-blue-500:   #1A6AA8;
    --vpm-yellow:     #E0E721;
    --vpm-red:        #EE2737;
    --vpm-red-700:    #B81E2A;
    --vpm-black:      #101820;
    --vpm-white:      #FFFFFF;
    --vpm-gray-600:   #5A6470;
    --vpm-gray-300:   #D1D3D4;
    --vpm-gray-100:   #F2F3F4;
    --vpm-gray-050:   #F8F9FA;
    --font-sans:      'Public Sans', 'GT America', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --font-display:   'IBM Plex Sans Condensed', 'Oswald', 'GT America Condensed', 'Arial Narrow', sans-serif;
  }

  .vpm-feedrail, .vpm-feedrail *, .vpm-feedrail *::before, .vpm-feedrail *::after {
    box-sizing: border-box;
  }

  .vpm-feedrail {
    font-family: var(--font-sans);
    background: var(--vpm-white);
    color: var(--vpm-black);
    max-width: 420px;
    border: 1px solid var(--vpm-gray-300);
    border-radius: 4px;
    overflow: hidden;
  }

  .vpm-feedrail__header {
    background: var(--vpm-dark-blue);
    color: var(--vpm-white);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vpm-feedrail__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--vpm-yellow);
    flex-shrink: 0;
  }

  .vpm-feedrail__title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .vpm-feedrail__list {
    list-style: none;
    margin: 0;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .vpm-feedrail__item {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border-radius: 3px;
    text-decoration: none;
    color: inherit;
    transition: background-color 0.15s ease;
  }

  .vpm-feedrail__item:hover {
    background: var(--vpm-gray-050);
  }

  .vpm-feedrail__item:focus-visible {
    outline: 2px solid var(--vpm-light-blue);
    outline-offset: 2px;
  }

  .vpm-feedrail__thumb {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--vpm-gray-100);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vpm-feedrail__thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .vpm-feedrail__thumb-icon {
    width: 22px;
    height: 22px;
    color: var(--vpm-gray-600);
  }

  .vpm-feedrail__play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(16, 24, 32, 0.28);
  }

  .vpm-feedrail__play svg {
    width: 20px;
    height: 20px;
  }

  .vpm-feedrail__body {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .vpm-feedrail__kicker {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--vpm-red-700);
  }

  .vpm-feedrail__kicker--video { color: var(--vpm-dark-blue); }
  .vpm-feedrail__kicker--audio { color: var(--vpm-blue-500); }
  .vpm-feedrail__kicker--text  { color: var(--vpm-gray-600); }

  .vpm-feedrail__headline {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--vpm-black);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .vpm-feedrail__meta {
    font-size: 11px;
    color: var(--vpm-gray-600);
  }

  .vpm-feedrail__snippet {
    font-size: 12px;
    line-height: 1.4;
    color: var(--vpm-gray-600);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .vpm-feedrail__empty {
    padding: 24px 18px;
    text-align: center;
    font-size: 13px;
    color: var(--vpm-gray-600);
  }

  @media (prefers-reduced-motion: reduce) {
    .vpm-feedrail__item { transition: none; }
  }
</style>
</head>
<body>

<div class="vpm-feedrail" aria-label="Latest updates">
  <div class="vpm-feedrail__header">
    <span class="vpm-feedrail__dot" aria-hidden="true"></span>
    <span class="vpm-feedrail__title">Latest Updates</span>
  </div>
  <ul class="vpm-feedrail__list"></ul>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  CONFIGURATION — edit this list to update the feed. No other code changes
//  needed. Newest item first.
//
//  Every item needs: type, title, source, url (text items may omit url).
//
//    type = 'video'
//      videoId : the YouTube video/Short ID (from youtube.com/shorts/<id> or
//                ?v=<id>) — pulls the thumbnail automatically, no API key
//
//    type = 'article'  (alias: 'link')
//      image   : optional thumbnail URL — falls back to a plain text row
//                with no image if left out
//      kicker  : optional label shown above the headline (default "Article")
//
//    type = 'audio'
//      image   : optional thumbnail URL — falls back to a headphone icon
//                tile if left out
//
//    type = 'text'
//      body    : one or two sentences shown under the headline
//      url     : optional — if omitted, the item isn't clickable, just a
//                plain note in the feed (e.g. an internal status update)
//
//  Shared, all types:
//    title   : headline text
//    source  : small label under the headline/body (e.g. "YouTube Short",
//              "VPM News", "Weekly Update")
// ─────────────────────────────────────────────────────────────────────────────
var FEED_ITEMS = [
  {
    type: 'video',
    title: 'How to read your Virginia ballot',
    source: 'YouTube Short',
    url: 'https://www.youtube.com/shorts/RAu42-tykzk',
    videoId: 'RAu42-tykzk'
  },
  {
    type: 'article',
    title: 'Five Virginia House seats rated as competitive heading into the fall',
    source: 'VPM News',
    url: 'https://www.vpm.org/news',
    image: 'https://img.youtube.com/vi/RAu42-tykzk/hqdefault.jpg',
    kicker: 'Congress'
  },
  {
    type: 'audio',
    title: 'Election night preview with VPM News reporters',
    source: 'VPM Radio · 12 min',
    url: 'https://www.vpm.org/listen'
  },
  {
    type: 'text',
    title: 'Polling locations confirmed for all 133 Richmond precincts',
    body: 'The city registrar finalized this year’s polling map Friday afternoon — no last-minute changes expected before November 3.',
    source: 'VPM News desk'
  }
];

var FEED_TITLE = 'Latest Updates';

// ─────────────────────────────────────────────────────────────────────────────
//  Logic — no edits needed below
// ─────────────────────────────────────────────────────────────────────────────
(function () {
  var root = document.currentScript.previousElementSibling;
  if (!root || !root.classList || !root.classList.contains('vpm-feedrail')) {
    root = document.querySelector('.vpm-feedrail');
  }
  if (!root) return;

  var titleEl = root.querySelector('.vpm-feedrail__title');
  var listEl = root.querySelector('.vpm-feedrail__list');
  if (!listEl) return;

  if (titleEl && FEED_TITLE) titleEl.textContent = FEED_TITLE;

  var playIcon = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  var audioIcon = '<svg class="vpm-feedrail__thumb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 14a2 2 0 0 1 2-2h1v6H6a2 2 0 0 1-2-2v-2Zm17 0a2 2 0 0 0-2-2h-1v6h1a2 2 0 0 0 2-2v-2ZM6 12a6 6 0 0 1 12 0"/></svg>';

  var KICKERS = { video: 'Video', article: 'Article', link: 'Article', audio: 'Audio', text: 'Update' };

  if (!FEED_ITEMS.length) {
    var empty = document.createElement('li');
    empty.className = 'vpm-feedrail__empty';
    empty.textContent = 'No updates yet — check back soon.';
    listEl.appendChild(empty);
    return;
  }

  FEED_ITEMS.forEach(function (item) {
    var li = document.createElement('li');
    var type = item.type || 'article';
    var hasUrl = !!item.url;

    var a = document.createElement(hasUrl ? 'a' : 'div');
    a.className = 'vpm-feedrail__item';
    if (hasUrl) {
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener';
    }

    var isVideo = type === 'video';
    var isAudio = type === 'audio';
    var isText = type === 'text';

    var thumbSrc = isVideo && item.videoId
      ? 'https://img.youtube.com/vi/' + encodeURIComponent(item.videoId) + '/hqdefault.jpg'
      : (item.image || '');

    var showThumb = !isText && (thumbSrc || isAudio || isVideo);

    if (showThumb) {
      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'vpm-feedrail__thumb';

      if (thumbSrc) {
        var img = document.createElement('img');
        img.src = thumbSrc;
        img.alt = '';
        img.loading = 'lazy';
        thumbWrap.appendChild(img);
      } else if (isAudio) {
        thumbWrap.innerHTML = audioIcon;
      }

      if (isVideo) {
        var overlay = document.createElement('span');
        overlay.className = 'vpm-feedrail__play';
        overlay.setAttribute('aria-hidden', 'true');
        overlay.innerHTML = playIcon;
        thumbWrap.appendChild(overlay);
      }

      a.appendChild(thumbWrap);
    }

    var body = document.createElement('div');
    body.className = 'vpm-feedrail__body';

    var kicker = document.createElement('span');
    kicker.className = 'vpm-feedrail__kicker vpm-feedrail__kicker--' + type;
    kicker.textContent = item.kicker || KICKERS[type] || 'Update';

    var headline = document.createElement('span');
    headline.className = 'vpm-feedrail__headline';
    headline.textContent = item.title || '';

    body.appendChild(kicker);
    body.appendChild(headline);

    if (isText && item.body) {
      var snippet = document.createElement('span');
      snippet.className = 'vpm-feedrail__snippet';
      snippet.textContent = item.body;
      body.appendChild(snippet);
    }

    if (item.source) {
      var meta = document.createElement('span');
      meta.className = 'vpm-feedrail__meta';
      meta.textContent = item.source;
      body.appendChild(meta);
    }

    a.appendChild(body);
    li.appendChild(a);
    listEl.appendChild(li);
  });
}());
</script>

</body>
</html>
