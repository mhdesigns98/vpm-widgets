<!--
  VPM Feed Rail
  Reusable stream of short updates (video, links, quick items) for placement
  alongside a main story or on a landing page. Content lives entirely in the
  FEED_ITEMS array in the <script> block below — no code changes needed
  beyond editing that list.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VPM Feed Rail</title>
<style>
  :root {
    --vpm-dark-blue:  #003865;
    --vpm-light-blue: #6CACE4;
    --vpm-yellow:     #E0E721;
    --vpm-red:        #EE2737;
    --vpm-black:      #101820;
    --vpm-white:      #FFFFFF;
    --vpm-gray-600:   #5A6470;
    --vpm-gray-300:   #D1D3D4;
    --vpm-gray-100:   #F2F3F4;
    --vpm-gray-050:   #F8F9FA;
    --font-sans:      'Public Sans', 'GT America', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --font-display:   'IBM Plex Sans Condensed', 'Oswald', 'GT America Condensed', 'Arial Narrow', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  .vpm-feedrail {
    font-family: var(--font-sans);
    background: var(--vpm-white);
    color: var(--vpm-black);
    max-width: 420px;
    border: 1px solid var(--vpm-gray-300);
    border-radius: 4px;
    overflow: hidden;
  }

  .vpm-feedrail__header {
    background: var(--vpm-dark-blue);
    color: var(--vpm-white);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vpm-feedrail__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--vpm-yellow);
    flex-shrink: 0;
  }

  .vpm-feedrail__title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .vpm-feedrail__list {
    list-style: none;
    margin: 0;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .vpm-feedrail__item {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border-radius: 3px;
    text-decoration: none;
    color: inherit;
    transition: background-color 0.15s ease;
  }

  .vpm-feedrail__item:hover {
    background: var(--vpm-gray-050);
  }

  .vpm-feedrail__item:focus-visible {
    outline: 2px solid var(--vpm-light-blue);
    outline-offset: 2px;
  }

  .vpm-feedrail__thumb {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--vpm-gray-100);
  }

  .vpm-feedrail__thumb--video {
    width: 96px;
    aspect-ratio: 9 / 16;
    height: auto;
  }

  .vpm-feedrail__thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .vpm-feedrail__play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(16, 24, 32, 0.28);
  }

  .vpm-feedrail__play svg {
    width: 28px;
    height: 28px;
  }

  .vpm-feedrail__body {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .vpm-feedrail__kicker {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--vpm-red);
  }

  .vpm-feedrail__kicker--video { color: var(--vpm-dark-blue); }

  .vpm-feedrail__headline {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--vpm-black);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .vpm-feedrail__meta {
    font-size: 11px;
    color: var(--vpm-gray-600);
  }

  .vpm-feedrail__empty {
    padding: 24px 18px;
    text-align: center;
    font-size: 13px;
    color: var(--vpm-gray-600);
  }

  @media (prefers-reduced-motion: reduce) {
    .vpm-feedrail__item { transition: none; }
  }
</style>
</head>
<body>

<div class="vpm-feedrail" aria-label="Latest updates">
  <div class="vpm-feedrail__header">
    <span class="vpm-feedrail__dot" aria-hidden="true"></span>
    <span class="vpm-feedrail__title" id="vpm-feedrail-title">Latest Updates</span>
  </div>
  <ul class="vpm-feedrail__list" id="vpm-feedrail-list"></ul>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  CONFIGURATION — edit this list to update the feed. No other code changes
//  needed. Newest item first.
//
//  Each item:
//    type    : 'video' | 'link'
//    title   : headline text
//    source  : small label under the headline (e.g. "YouTube Short", "VPM News")
//    url     : where the item links to
//    videoId : (video only) the YouTube video/short ID — used to pull the
//              thumbnail automatically, no API key required
//    image   : (link only, optional) thumbnail image URL
// ─────────────────────────────────────────────────────────────────────────────
var FEED_ITEMS = [
  {
    type: 'video',
    title: 'How to read your Virginia ballot',
    source: 'YouTube Short',
    url: 'https://www.youtube.com/shorts/RAu42-tykzk',
    videoId: 'RAu42-tykzk'
  }
];

var FEED_TITLE = 'Latest Updates';

// ─────────────────────────────────────────────────────────────────────────────
//  Logic — no edits needed below
// ─────────────────────────────────────────────────────────────────────────────
(function () {
  var root = document.currentScript.previousElementSibling;
  if (!root || !root.classList || !root.classList.contains('vpm-feedrail')) {
    root = document.querySelector('.vpm-feedrail');
  }
  if (!root) return;

  var titleEl = root.querySelector('#vpm-feedrail-title') || root.querySelector('.vpm-feedrail__title');
  var listEl = root.querySelector('#vpm-feedrail-list') || root.querySelector('.vpm-feedrail__list');
  if (!listEl) return;

  if (titleEl && FEED_TITLE) titleEl.textContent = FEED_TITLE;

  var playIcon = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  if (!FEED_ITEMS.length) {
    var empty = document.createElement('li');
    empty.className = 'vpm-feedrail__empty';
    empty.textContent = 'No updates yet — check back soon.';
    listEl.appendChild(empty);
    return;
  }

  FEED_ITEMS.forEach(function (item) {
    var li = document.createElement('li');

    var a = document.createElement('a');
    a.className = 'vpm-feedrail__item';
    a.href = item.url || '#';
    a.target = '_blank';
    a.rel = 'noopener';

    var isVideo = item.type === 'video';

    var thumbWrap = document.createElement('div');
    thumbWrap.className = 'vpm-feedrail__thumb' + (isVideo ? ' vpm-feedrail__thumb--video' : '');

    var thumbSrc = isVideo && item.videoId
      ? 'https://img.youtube.com/vi/' + encodeURIComponent(item.videoId) + '/hqdefault.jpg'
      : (item.image || '');

    if (thumbSrc) {
      var img = document.createElement('img');
      img.src = thumbSrc;
      img.alt = '';
      img.loading = 'lazy';
      thumbWrap.appendChild(img);
    }

    if (isVideo) {
      var overlay = document.createElement('span');
      overlay.className = 'vpm-feedrail__play';
      overlay.setAttribute('aria-hidden', 'true');
      overlay.innerHTML = playIcon;
      thumbWrap.appendChild(overlay);
    }

    var body = document.createElement('div');
    body.className = 'vpm-feedrail__body';

    var kicker = document.createElement('span');
    kicker.className = 'vpm-feedrail__kicker' + (isVideo ? ' vpm-feedrail__kicker--video' : '');
    kicker.textContent = isVideo ? 'Video' : (item.kicker || 'Link');

    var headline = document.createElement('span');
    headline.className = 'vpm-feedrail__headline';
    headline.textContent = item.title || '';

    body.appendChild(kicker);
    body.appendChild(headline);

    if (item.source) {
      var meta = document.createElement('span');
      meta.className = 'vpm-feedrail__meta';
      meta.textContent = item.source;
      body.appendChild(meta);
    }

    a.appendChild(thumbWrap);
    a.appendChild(body);
    li.appendChild(a);
    listEl.appendChild(li);
  });
}());
</script>

</body>
</html>
