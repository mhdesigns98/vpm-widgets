<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VPM Elections Newsletter</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root {
    --azure-9:  #101820;
    --azure-13: #024;
    --azure-66: #6cace4;
    --azure-79: #b9c8d8;
    --yellow-52: #e0e721;
    --white: #ffffff;
    --border-azure-20: rgba(108,172,228,0.2);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--azure-9);
    color: var(--white);
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .vg-heading-font { font-family: 'Oswald', Impact, 'Arial Narrow', sans-serif; }

  .vg-newsletter-bar {
    max-width: 560px;
    margin: 0 auto;
    text-align: center;
    padding: 64px 24px;
  }
  .vg-eyebrow {
    color: var(--azure-66);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  .vg-newsletter-bar h1 {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 32px;
    margin: 8px 0 8px;
  }
  .vg-newsletter-bar p {
    color: var(--azure-79);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .vg-newsletter-form {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 420px;
    margin: 0 auto;
  }
  .vg-newsletter-form input[type=email] {
    flex: 1;
    min-width: 220px;
    padding: 12px 14px;
    border-radius: 2px;
    border: 1px solid var(--border-azure-20);
    background: rgba(255,255,255,0.05);
    color: var(--white);
    font-size: 14px;
  }
  .vg-newsletter-form input[type=email]::placeholder { color: #8e98a5; }
  .vg-newsletter-form input[type=email]:focus {
    outline: none;
    border-color: var(--azure-66);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 3px rgba(108,172,228,0.18);
  }
  .vg-newsletter-form button {
    background: var(--yellow-52);
    color: var(--azure-9);
    border: none;
    padding: 12px 22px;
    border-radius: 2px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.15s ease, box-shadow 0.15s ease;
  }
  .vg-newsletter-form button:hover:not(:disabled) {
    filter: brightness(1.08);
    box-shadow: 0 6px 18px rgba(224,231,33,0.28);
  }
  .vg-newsletter-form button:disabled { opacity: 0.6; cursor: default; }

  .cf-turnstile { display: flex; justify-content: center; margin-top: 16px; }

  .vg-newsletter-status {
    margin: 12px 0 0;
    font-size: 12px;
    color: var(--azure-79);
    min-height: 16px;
  }

  @media (max-width: 520px) {
    .vg-newsletter-bar { padding: 36px 18px; }
    .vg-newsletter-bar h1 { font-size: 26px; }
    .vg-newsletter-form { flex-direction: column; }
    .vg-newsletter-form input[type=email],
    .vg-newsletter-form button { width: 100%; min-width: 0; }
  }
</style>
</head>
<body>

<div class="vg-newsletter-bar">
  <span class="vg-eyebrow">Stay Informed</span>
  <h1 class="vg-heading-font">VPM Elections Newsletter</h1>
  <p>Get the latest Virginia election news, candidate profiles, and voting reminders, delivered to your inbox.</p>
  <form class="vg-newsletter-form" id="vg-newsletter-form">
    <input type="email" id="vg-newsletter-email" placeholder="Your email address" required>
    <button type="submit">Subscribe</button>
  </form>
  <div class="cf-turnstile" data-sitekey="0x4AAAAAAEMMxbT7t6Mb3D7z" data-action="voter-guide-2026-newsletter" data-theme="dark"></div>
  <p class="vg-newsletter-status" id="vg-newsletter-status" role="status" aria-live="polite"></p>
</div>

<script>
  // Absolute URL so this works identically whether served from this Pages site
  // or embedded elsewhere via iframe — matches public/index.html's pattern.
  const API_BASE_URL = 'https://newsletter-signup-8kv.pages.dev/api/subscribe';

  const form = document.getElementById('vg-newsletter-form');
  const emailInput = document.getElementById('vg-newsletter-email');
  const status = document.getElementById('vg-newsletter-status');
  const button = form.querySelector('button[type=submit]');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    if (!email) return;

    const turnstileInput = document.querySelector('[name="cf-turnstile-response"]');
    const turnstileToken = turnstileInput ? turnstileInput.value : undefined;

    button.disabled = true;
    status.textContent = 'Submitting…';

    try {
      const response = await fetch(API_BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          newsletters: ['morning-monitor'],
          source: 'elections',
          turnstileToken: turnstileToken,
        }),
      });

      const data = await response.json();

      if (response.ok) {
        status.textContent = 'Thanks — check your inbox to confirm.';
        form.reset();
        if (window.turnstile) window.turnstile.reset();
      } else {
        status.textContent = data.error || 'Something went wrong. Please try again.';
        if (window.turnstile) window.turnstile.reset();
      }
    } catch (err) {
      status.textContent = 'Something went wrong. Please try again.';
      if (window.turnstile) window.turnstile.reset();
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
