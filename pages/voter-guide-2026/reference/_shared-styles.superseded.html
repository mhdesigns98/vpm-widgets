<!--
  VPM Voter Guide — Shared Styles (fallback / optional)
  ==========================================================
  This is a COPY of the same style block bundled inside
  header-section.html. You do NOT need to add this separately if
  header-section.html is present on the page — it already includes
  these styles once.

  Use this file ONLY if you build a page that uses one or more of the
  other section fragments (Section Nav, Video, Elections, Regional,
  FAQ, Newsletter) WITHOUT including the Header Section — paste this
  once, anywhere on that page, instead.

  It also carries the "LIVE BLOCK OVERRIDES" rules that restyle the
  CMS's own Article List block (see header-section.html) — those are
  the only un-prefixed selectors in here, and they are required for a
  live story feed to match the design.

  Keep this file in sync with header-section.html; it is generated
  from it, and doubles as the recovery anchor if any single fragment
  gets corrupted.
-->
<style>
  .vpm-vg{
    --azure-9:#101820;
    --azure-9-2:#0d1520;
    --azure-13:#024;
    --azure-20:#003865;
    --azure-28:#3d4652;
    --azure-40:#8e98a5;
    --azure-66:#6cace4;
    --azure-79:#b9c8d8;
    --yellow-52:#e0e721;
    --red-54:#ee2737;
    --red-64:#ff5566;
    --grey-53:#838d99;
    --white:#ffffff;
    --border-faint:rgba(255,255,255,0.06);
    --border-faint2:rgba(255,255,255,0.07);
    --border-faint3:rgba(255,255,255,0.08);
    --border-azure-30:rgba(108,172,228,0.3);
    --border-azure-20:rgba(108,172,228,0.2);
  }

  .vpm-vg * {box-sizing:border-box;}
  .vpm-vg{
    background:var(--azure-9);
    color:var(--white);
    font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .vpm-vg img {max-width:100%;display:block;}
  .vpm-vg a {color:inherit;text-decoration:none;}
  .vpm-vg .vg-heading-font {font-family:'Oswald',Impact,'Arial Narrow',sans-serif;}

  .vpm-vg .vg-wrap {
    max-width:1200px;
    margin:0 auto;
    padding-left:24px;
    padding-right:24px;
  }

  /* ---------- Header ---------- */
  .vpm-vg .vg-site-header-note {
    background:var(--azure-13);
    border-bottom:2px dashed var(--border-azure-30);
    text-align:center;
    padding:12px 24px 14px;
    font-size:12px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--azure-40);
  }
  .vpm-vg .vg-promo-bar {
    background:var(--azure-13);
    border-bottom:1px solid var(--border-azure-20);
    padding:10px 0 11px;
  }
  .vpm-vg .vg-promo-inner {
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .vpm-vg .vg-promo-tag {
    background:var(--red-54);
    color:var(--white);
    font-size:10px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:1px;
    white-space:nowrap;
  }
  .vpm-vg .vg-promo-text {
    flex:1;
    min-width:200px;
    font-size:13px;
    line-height:19.5px;
    color:var(--azure-79);
  }
  .vpm-vg .vg-promo-link {
    display:flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    color:var(--azure-66);
    white-space:nowrap;
  }
  .vpm-vg .vg-promo-link svg {width:11px;height:11px;}

  /* ---------- Section nav ---------- */
  /* NOTE: no `html{scroll-behavior:smooth}` here — a global selector would leak
     out of this fragment and change scrolling for the whole site. Smooth scroll
     is handled by the nav click handler in the <script> at the end of this
     fragment instead. */
  .vpm-vg #video, .vpm-vg #elections, .vpm-vg #regional, .vpm-vg #faq {scroll-margin-top:64px;}
  .vpm-vg .vg-section-nav {
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(0,34,68,0.92);
    backdrop-filter:saturate(140%) blur(8px);
    -webkit-backdrop-filter:saturate(140%) blur(8px);
    border-top:1px solid var(--border-azure-20);
    border-bottom:1px solid var(--border-azure-20);
  }
  .vpm-vg .vg-section-nav-inner {
    display:flex;
    align-items:center;
    gap:20px;
    min-height:48px;
  }
  .vpm-vg .vg-section-nav-label {
    flex-shrink:0;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--azure-40);
  }
  .vpm-vg .vg-section-nav ul {
    display:flex;
    gap:4px;
    margin:0;
    padding:0;
    list-style:none;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .vpm-vg .vg-section-nav ul::-webkit-scrollbar {display:none;}
  .vpm-vg .vg-section-nav a {
    display:block;
    white-space:nowrap;
    padding:8px 12px;
    border-radius:3px;
    font-size:13px;
    font-weight:500;
    color:var(--azure-79);
    transition:color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  }
  .vpm-vg .vg-section-nav a:hover {
    color:#fff;
    background:rgba(255,255,255,0.06);
  }
  .vpm-vg .vg-section-nav a.vg-active {
    color:var(--azure-9);
    background:var(--yellow-52);
    font-weight:600;
  }

  /* ---------- Hero ---------- */
  .vpm-vg .vg-hero-section {
    padding-top:56px;
  }
  /* Band that carries only the "Featured Stories" label; the cards themselves
     are the live Article List block pasted immediately after this fragment. */
  .vpm-vg .vg-featured-band {
    padding-top:16px;
    padding-bottom:16px;
  }
  /* the label's own bottom margin would collapse out through the bottom of the
     fragment and show as a white strip above the live block — zero it here */
  .vpm-vg .vg-featured-band .vg-section-label {margin-bottom:0;}
  .vpm-vg .vg-hero-row {
    display:flex;
    gap:48px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .vpm-vg .vg-hero-main {flex:1 1 0;min-width:320px;}
  .vpm-vg .vg-eyebrow {
    color:var(--azure-66);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin:0 0 12px;
  }
  .vpm-vg .vg-headline {margin:0;font-weight:700;}
  .vpm-vg .vg-headline span {
    display:block;
    margin:0;
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(48px,7.5vw,108px);
    line-height:0.92;
    letter-spacing:-1px;
  }
  .vpm-vg .vg-headline .vg-l1 {color:var(--azure-66);}
  .vpm-vg .vg-headline .vg-l2 {color:var(--yellow-52);}
  .vpm-vg .vg-headline .vg-l3 {color:var(--white);}
  .vpm-vg .vg-hero-dek {
    color:var(--azure-79);
    font-size:16px;
    line-height:24px;
    max-width:500px;
    margin:18px 0 28px;
  }
  .vpm-vg .vg-section-label {
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 16px;
  }
  .vpm-vg .vg-section-label .vg-accent {
    width:3px;height:16px;background:var(--yellow-52);border-radius:1px;flex-shrink:0;
  }
  .vpm-vg .vg-section-label span,
  .vpm-vg .vg-section-label h2 {
    margin:0;
    font-weight:600;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#c8d0d8;
  }
  /* Larger, mixed-case variant used as each band's real <h2> heading
     (was an inline style="font-size:28px..." before the headings were
     promoted from <span> to <h2>). */
  .vpm-vg .vg-section-label h2.vg-section-title {
    font-size:28px;
    line-height:1.15;
    letter-spacing:-0.28px;
    text-transform:none;
    font-weight:600;
    color:var(--white);
  }

  .vpm-vg .vg-kicker {
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .vpm-vg .vg-kicker.vg-k-red {color:var(--red-64);}
  .vpm-vg .vg-kicker.vg-k-azure {color:var(--azure-66);}
  .vpm-vg .vg-kicker.vg-k-tag {
    background:var(--yellow-52);
    color:var(--azure-9);
    display:inline-block;
    width:fit-content;
    padding:2px 6px;
    border-radius:1px;
    font-size:10px;
  }
  .vpm-vg .vg-card-title {
    font-weight:500;
    font-size:13px;
    line-height:19.5px;
    color:var(--white);
  }
  .vpm-vg .vg-byline {
    font-size:11px;
    color:var(--grey-53);
  }
  /* =========================================================================
     LIVE BLOCK OVERRIDES — Featured Stories article list
     -------------------------------------------------------------------------
     These are the ONLY un-prefixed selectors allowed in this stylesheet. They
     restyle the CMS's own "Article List" block (inserted by an editor at the
     SPLIT marker below) so the live story feed matches the retired static
     Featured Stories cards. The live block renders OUTSIDE .vpm-vg, so it can't
     inherit the custom properties above — they are redeclared here.
     Do not add any other bare/global selectors to this sheet.
     ========================================================================= */
  section.page-article-grid {
    --vg-azure-9:#101820;
    --vg-azure-66:#6cace4;
    --vg-yellow-52:#e0e721;
    --vg-grey-53:#838d99;
    --vg-border-azure-30:rgba(108,172,228,0.3);
    background:var(--vg-azure-9);
    padding:0 0 8px;
    font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  section.page-article-grid * {box-sizing:border-box;}
  /* full-bleed band, content re-centered on the same 1200px/24px grid as .vg-wrap */
  section.page-article-grid > .container {
    max-width:none;
    padding:0;
  }
  section.page-article-grid .page-article-grid-inner {
    max-width:1200px;
    margin:0 auto;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    background:transparent;
  }
  /* the grid-header only renders when the editor sets a title — the preceding
     fragment already supplies the "Featured Stories" label, so hide it */
  section.page-article-grid .page-article-grid-header {display:none;}

  section.page-article-grid article.page-article-card {
    position:relative;
    background:var(--vg-azure-9);
    display:flex;
    flex-direction:column;
    outline:1px solid rgba(255,255,255,0.06);
    transition:transform 0.18s ease, box-shadow 0.18s ease;
    will-change:transform;
  }
  section.page-article-grid .page-article-card-media {
    width:100%;
    aspect-ratio:16/9.4;
    overflow:hidden;
  }
  section.page-article-grid .page-article-card-media a,
  section.page-article-grid .page-article-card-media img {
    display:block;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    object-fit:cover;
    transition:transform 0.4s cubic-bezier(0.2,0.7,0.2,1);
  }
  /* story with no image: branded placeholder tile instead of a stretched icon */
  section.page-article-grid .page-article-card-media a.bsm-img-ph,
  section.page-article-grid .page-article-card-media .bsm-img-ph {
    background-color:#0d1520;
    background-image:url("https://vpm-voter-guide.vercel.app/assets/icon-video-unavailable.svg");
    background-repeat:no-repeat;
    background-position:center;
    background-size:36px 36px;
    opacity:0.7;
  }
  section.page-article-grid .page-article-category {
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--vg-azure-66);
    padding:19px 14px 0;
  }
  section.page-article-grid .page-article-title {
    margin:6px 0 0;
    padding:0 14px;
    font-weight:500;
    font-size:13px;
    line-height:19.5px;
    color:#fff;
  }
  section.page-article-grid .page-article-title a {
    color:inherit;
    text-decoration:none;
    transition:color 0.15s ease;
  }
  section.page-article-grid .page-article-byline {
    padding:6px 14px 16px;
    font-size:11px;
    color:var(--vg-grey-53);
  }
  section.page-article-grid .page-article-excerpt {display:none;}
  /* 3px accent bar pinned to the bottom of each card, cycling the brand
     accents in the same order the static cards used (red → blue → yellow) */
  section.page-article-grid article.page-article-card::after {
    content:"";
    display:block;
    margin-top:auto;
    height:3px;
    width:100%;
    background:#f44250;
  }
  section.page-article-grid .page-article-grid-inner > article:nth-child(3n+2)::after {background:#5ba8e0;}
  section.page-article-grid .page-article-grid-inner > article:nth-child(3n+3)::after {background:var(--vg-yellow-52);}
  /* hover: lift the card, zoom the image, tint the headline */
  section.page-article-grid article.page-article-card:hover {
    transform:translateY(-4px);
    box-shadow:0 12px 28px rgba(0,0,0,0.45);
    outline-color:var(--vg-border-azure-30);
    z-index:1;
  }
  section.page-article-grid article.page-article-card:hover .page-article-card-media a,
  section.page-article-grid article.page-article-card:hover .page-article-card-media img {
    transform:scale(1.05);
  }
  section.page-article-grid article.page-article-card:hover .page-article-title a {color:var(--vg-azure-66);}
  section.page-article-grid a:focus-visible {
    outline:2px solid var(--vg-azure-66);
    outline-offset:3px;
  }
  @media (max-width:760px){
    section.page-article-grid .page-article-grid-inner {grid-template-columns:1fr;}
  }
  @media (max-width:520px){
    section.page-article-grid .page-article-grid-inner {padding:0 16px;}
  }
  @media (prefers-reduced-motion:reduce){
    section.page-article-grid * {transition-duration:0.001ms !important;}
  }
  /* ================= end live block overrides ================= */

  /* ---------- Sidebar ---------- */
  .vpm-vg .vg-sidebar {
    width:340px;
    flex:0 0 340px;
    display:flex;
    flex-direction:column;
    gap:24px;
    padding-top:16px;
  }
  .vpm-vg .vg-dates-box {
    background:var(--azure-13);
    border:1px solid var(--yellow-52);
    border-top-width:3px;
    padding:24px 25px;
  }
  .vpm-vg .vg-dates-box .vg-eyebrow {color:var(--yellow-52);margin-bottom:16px;}
  .vpm-vg .vg-date-row {
    display:flex;
    gap:16px;
    padding:14px 0;
    border-bottom:1px solid var(--border-faint3);
  }
  .vpm-vg .vg-date-row:last-of-type {border-bottom:none;}
  .vpm-vg .vg-date-chip {
    font-family:'Oswald',Impact,sans-serif;
    color:var(--yellow-52);
    font-size:22px;
    line-height:1.27;
    text-align:center;
    min-width:56px;
    flex-shrink:0;
  }
  .vpm-vg .vg-date-info-title {
    font-weight:500;
    font-size:14px;
    color:var(--white);
    margin:0 0 2px;
  }
  .vpm-vg .vg-date-info-sub {
    font-size:12px;
    color:var(--grey-53);
    margin:0;
  }
  .vpm-vg .vg-cal-link {
    display:block;
    text-align:center;
    background:var(--yellow-52);
    color:var(--azure-9);
    font-weight:600;
    font-size:12px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    padding:10px;
    border-radius:2px;
    margin-top:16px;
  }
  .vpm-vg .vg-promo-slot {
    border-radius:4px;
    overflow:hidden;
    background:#0c121a;
    border:1px dashed var(--border-azure-30);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .vpm-vg .vg-promo-slot .vg-promo-slot-text {
    text-align:center;
    color:var(--azure-40);
  }
  .vpm-vg .vg-promo-slot .vg-promo-slot-text .vg-promo-slot-title {
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    font-weight:600;
    margin:0 0 4px;
  }
  .vpm-vg .vg-promo-slot .vg-promo-slot-text .vg-promo-slot-size {
    font-size:11px;
    margin:0;
  }
  .vpm-vg .vg-slot-300x250 {width:300px;height:250px;}
  .vpm-vg .vg-slot-300x600 {width:300px;height:600px;}
  .vpm-vg .vg-slot-caption {
    font-size:10px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--azure-40);
    text-align:center;
    margin:6px 0 0;
  }

  /* ---------- Leaderboard promo ---------- */
  .vpm-vg .vg-banner-slot {
    background:#0c121a;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 0;
  }
  .vpm-vg .vg-banner-slot .vg-promo-slot {
    width:100%;
    max-width:970px;
    height:90px;
    border-radius:4px;
  }

  /* ---------- Generic sections ---------- */
  .vpm-vg section.vg-block {
    padding:64px 0;
  }
  .vpm-vg section.vg-block.vg-alt {background:var(--azure-9-2);}
  .vpm-vg .vg-section-sub {
    color:var(--grey-53);
    font-size:15px;
    line-height:22.5px;
    margin:0 0 16px 15px;
  }

  /* ---------- Video section ---------- */
  .vpm-vg .vg-video-grid {
    display:grid;
    grid-template-columns:3fr 2fr;
    gap:24px;
    margin-top:16px;
    align-items:start;
  }
  .vpm-vg .vg-video-player {
    background:#000;
    border-radius:2px;
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:16px;
    background-image:linear-gradient(90deg, rgb(40,40,40) 0%, rgb(40,40,40) 100%);
    position:relative;
  }
  .vpm-vg .vg-video-player img.vg-unavailable-icon {width:64px;height:64px;opacity:0.9;}
  .vpm-vg .vg-video-player .vg-msg {color:#eee;font-size:20px;text-align:center;}
  .vpm-vg .vg-video-player .vg-yt-icon {position:absolute;bottom:12px;right:12px;width:44px;height:44px;opacity:0.7;}
  .vpm-vg .vg-video-meta {margin-top:12px;}
  .vpm-vg .vg-video-meta .vg-card-title {font-size:16px;line-height:24px;font-weight:500;margin:6px 0 4px;}
  .vpm-vg .vg-video-meta .vg-byline {font-size:13px;}
  .vpm-vg .vg-video-cta{margin-top:28px;display:flex;justify-content:center;}
  .vpm-vg .vg-yt-cta{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--red-54);color:#fff;
    padding:12px 22px;border-radius:3px;
    font-size:13px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;
    transition:filter 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
  }
  .vpm-vg .vg-yt-cta:hover{filter:brightness(1.08);box-shadow:0 6px 18px rgba(238,39,55,0.32);}
  .vpm-vg .vg-yt-cta:active{transform:translateY(1px);}
  .vpm-vg .vg-yt-cta-icon{width:20px;height:20px;flex-shrink:0;}

  .vpm-vg .vg-shorts-label {
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--grey-53);
    margin-bottom:12px;
  }
  .vpm-vg .vg-short-item {
    display:flex;
    gap:12px;
    align-items:center;
    background:var(--azure-9);
    border:1px solid var(--border-faint);
    border-radius:2px;
    padding:11px;
    margin-bottom:8px;
  }
  .vpm-vg .vg-short-thumb {
    position:relative;
    width:72px;
    aspect-ratio:72/128;
    border-radius:2px;
    overflow:hidden;
    flex-shrink:0;
  }
  .vpm-vg .vg-short-thumb img {width:100%;height:100%;object-fit:cover;}
  .vpm-vg .vg-short-thumb .vg-play-overlay {
    position:absolute;inset:0;
    background:rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
  }
  .vpm-vg .vg-short-thumb .vg-play-overlay img {width:14px;height:14px;object-fit:contain;}
  .vpm-vg .vg-short-title {font-weight:500;font-size:13px;line-height:19.5px;color:var(--white);margin:0 0 4px;}
  .vpm-vg .vg-short-sub {font-size:11px;color:var(--azure-40);margin:0;}

  /* ---------- Latest coverage grid ---------- */
  .vpm-vg .vg-coverage-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-top:16px;
  }
  .vpm-vg .vg-coverage-card {
    background:var(--azure-9-2);
    border:1px solid var(--border-faint2);
    border-radius:2px;
    overflow:hidden;
  }
  .vpm-vg .vg-coverage-card .vg-thumb {width:100%;aspect-ratio:4/2.9;overflow:hidden;}
  .vpm-vg .vg-coverage-card .vg-thumb img {width:100%;height:100%;object-fit:cover;}
  .vpm-vg .vg-coverage-card .vg-body {padding:12px 14px 16px;display:flex;flex-direction:column;gap:4px;}
  .vpm-vg .vg-coverage-card .vg-headline-text {font-size:14px;line-height:21px;color:var(--grey-53);}
  .vpm-vg .vg-coverage-card .vg-byline {font-size:11px;color:var(--grey-53);}
  .vpm-vg .vg-feed-note {
    text-align:center;
    margin-top:20px;
  }
  .vpm-vg .vg-feed-note span {
    display:inline-block;
    border:1px dashed var(--border-azure-30);
    border-radius:2px;
    padding:11px 25px;
    font-size:12px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--azure-40);
  }

  /* ---------- Content + Ad row (Key VA Elections) ---------- */
  .vpm-vg .vg-content-slot-row {
    display:flex;
    gap:40px;
    align-items:flex-start;
