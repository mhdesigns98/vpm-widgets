<!--
  VPM Voter Guide — VPM Video Coverage Section (ACF)
  Merged 2026-09-22: was two separate fragments/sections (Video Coverage +
  Video Shorts) that read as duplicates on the page (near-identical titles,
  both "watch VPM video" sections back to back). Now one section, stacked at every width
  (changed 2026-10-05; was side by side on desktop): the YouTube playlist player on top
  (16:9, centered, max 820px; title/byline update live via the IFrame API), the JW
  vertical-shorts carousel full width below it, then the CTA row. The JW placement is a
  fixed 400px tall, so no script has to size it to the player. Layout CSS lives in the
  <style> below, not header-section.html, so re-pasting this block alone can't break it.
  Requires the shared styles from header-section.html (or
  _shared-styles.html) to be present elsewhere on the page.
-->
<style>
  .vpm-vg .vg-vs-row {
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:24px;
    margin-top:16px;
  }
  /* Stacked at every width: YouTube player on top (centered, capped so it never gets taller
     than ~460px), JW shorts carousel full width below it. */
  .vpm-vg .vg-vs-player {order:-1;width:100%;max-width:820px;margin:0 auto;}
  .vpm-vg .vg-vs-yt {
    position:relative;
    aspect-ratio:16/9;
    background:#000;
    border-radius:2px;
    overflow:hidden;
  }
  .vpm-vg .vg-vs-yt iframe {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  /* JW sizes its cards once, at init, to (placement height - 24px), with 12px
     padding above and below. The script below sets the placement to the
     player's height + 24px before embed.js runs; the wrapper's -12px margins bleed that
     padding out so card edges land exactly on the player's edges. */
  /* JW pads its carousel 12px on every side; bleed that out so cards align with the player. */
  .vpm-vg .vg-vs-jw {margin:-12px;}
  .vpm-vg .vg-vs-jw [data-jw-placement-id] {height:400px;}
</style>
<div class="vpm-vg">
  <section class="vg-block vg-alt" id="video">
    <div class="vg-wrap">
      <div class="vg-section-label"><span class="vg-accent"></span><h2 class="vg-section-title">VPM Video Coverage</h2></div>
      <p class="vg-section-sub">Watch VPM's election reporting</p>

      <div class="vg-vs-row">
        <div class="vg-vs-jw">
          <div id="publisher_div" data-jw-placement-id="4CIEdm4o"></div>
        </div>
        <div class="vg-vs-player">
          <div class="vg-vs-yt">
            <div id="vg-yt-playlist-player" style="position:absolute;inset:0;width:100%;height:100%;"></div>
          </div>
          <div class="vg-video-meta">
            <p class="vg-kicker vg-k-red" id="vg-yt-status">Video</p>
            <p class="vg-card-title" id="vg-yt-title">VPM News — Election Coverage Playlist</p>
            <p class="vg-byline" id="vg-yt-byline">VPM News · 2026</p>
          </div>
        </div>
      </div>

      <div class="vg-video-cta">
        <a class="vg-yt-cta" href="https://www.youtube.com/@VPM" target="_blank" rel="noopener noreferrer">
          <svg class="vg-yt-cta-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 4.8 12 4.8 12 4.8s-7 0-8.9.6A3 3 0 0 0 1 7.5 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1c1.9.6 8.9.6 8.9.6s7 0 8.9-.6A3 3 0 0 0 23 16.5 31 31 0 0 0 23.5 12 31 31 0 0 0 23 7.5ZM9.8 15.3V8.7l5.7 3.3-5.7 3.3Z"/></svg>
          Visit VPM on YouTube
        </a>
      </div>
    </div>
  </section>
</div>
<script>
(function () {
  var PLAYLIST_ID = 'PLDpD9qYyo0hIRsLNnOuzjot8VxVIp4rKb';
  var player;

  var statusEl = document.getElementById('vg-yt-status');
  var titleEl = document.getElementById('vg-yt-title');
  var bylineEl = document.getElementById('vg-yt-byline');

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var previousReady = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function () {
    if (typeof previousReady === 'function') previousReady();
    player = new YT.Player('vg-yt-playlist-player', {
      height: '100%',
      width: '100%',
      playerVars: { listType: 'playlist', list: PLAYLIST_ID, rel: 0, modestbranding: 1 },
      events: {
        onReady: function () { updateVideoInfo(); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.CUED) updateVideoInfo();
        }
      }
    });
  };

  function updateVideoInfo() {
    if (!player) return;
    try {
      var videoUrl = player.getVideoUrl();
      var videoId = new URL(videoUrl).searchParams.get('v');
      if (!videoId) return;

      fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + videoId + '&format=json')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          statusEl.textContent = 'Now Playing';
          titleEl.textContent = data.title || 'VPM News — Election Coverage Playlist';
          bylineEl.textContent = data.author_name ? data.author_name : 'VPM News · 2026';
        })
        .catch(function () {
          statusEl.textContent = 'Now Playing';
        });
    } catch (err) {
      statusEl.textContent = 'Now Playing';
    }
  }
})();
</script>
<script src="https://cdn.jwplayer.com/v2/sites/I7gSgtcs/placements/embed.js"></script>
