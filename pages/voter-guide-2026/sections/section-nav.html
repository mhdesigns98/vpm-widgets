<!--
  VPM Voter Guide — Section Nav (ACF)
  ===================================
  Paste order: its own Code Block directly AFTER the header block (results-header-section.html).
  The results header skips Code Blocks when it looks for the stories block under it, so
  this nav sitting in between doesn't change where the AP panel moves at 1 p.m. Nov. 4.

  Built for the sections on vpm.org/elections as of Nov. 3, 2026:
    #results        AP panel (results header; moves below the stories on Nov. 4)
    #need-to-know   "What You Need to Know" Promo List
    #faq            Voting FAQ Code Block
    #key-elections  "Know Your Candidates" Promo List (id set in the CMS)
    #amendments     "Proposed Constitutional Amendments" Promo List
    #video          VPM Video Coverage Code Block
    #latest         "Latest Coverage" Article List

  CMS blocks without an id: a link with data-vg-heading finds the section whose h2 or
  h3 starts with that text (any case; several headings separated by |) and gives it the id. Setting the id on the block in the CMS is
  sturdier; a rename of the heading otherwise drops the link. A link whose section
  isn't on the page is hidden, never left dead. Links sort into page order, and
  re-sort when the AP panel moves.

  With the results header above it, the script moves the nav up into the header, between
  the title and the AP panel, so it isn't stranded below the full AP table.

  A Code Block is too short a parent for position:sticky, so the script pins the nav
  (class vg-pinned, CSS in results-header-section.html) once it scrolls past the top.
  Requires the shared <style> block from results-header-section.html on the page.
-->
<div class="vpm-vg">
  <div class="vg-section-nav-spacer" aria-hidden="true"></div>
  <nav class="vg-section-nav" aria-label="Page sections">
    <div class="vg-wrap vg-section-nav-inner">
      <span class="vg-section-nav-label">On this page</span>
      <ul>
        <li><a href="#results">Results</a></li>
        <li><a href="#need-to-know" data-vg-heading="What You Need to Know">What You Need to Know</a></li>
        <li><a href="#faq">Voting FAQ</a></li>
        <li><a href="#key-elections" data-vg-heading="Know Your Candidates">Candidates</a></li>
        <li><a href="#amendments" data-vg-heading="Proposed Constitutional Amendments">Amendments</a></li>
        <li><a href="#video">Video</a></li>
        <li><a href="#latest" data-vg-heading="Latest Coverage|Latest Election Coverage|Latest Stories">Latest Coverage</a></li>
      </ul>
    </div>
  </nav>
</div>

<script>
  (function () {
    var script = document.currentScript;
    var wrap = script && script.previousElementSibling;
    var nav = wrap && wrap.querySelector('.vg-section-nav');
    if (!nav) return;
    var spacer = wrap.querySelector('.vg-section-nav-spacer');
    var list = nav.querySelector('ul');
    var links = Array.prototype.slice.call(nav.querySelectorAll('a'));
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');

    function idOf(a) { return a.getAttribute('href').slice(1); }
    function target(a) { return document.getElementById(idOf(a)); }

    function norm(t) { return t.replace(/\s+/g, ' ').trim().toLowerCase(); }

    // Give un-ided CMS blocks the id their link expects, by heading text: a match is a
    // heading that starts with one of the link's |-separated names, in any case, so
    // "Latest Election Coverage from VPM" matches "Latest Election Coverage".
    function claimIds() {
      links.forEach(function (a) {
        var names = (a.getAttribute('data-vg-heading') || '').split('|').map(norm).filter(Boolean);
        if (!names.length || target(a)) return;
        var heads = document.querySelectorAll('section.page-section h2, section.page-section h3:not(.page-article-title):not(.page-promo-title)');
        for (var i = 0; i < heads.length; i++) {
          var h = norm(heads[i].textContent);
          if (!names.some(function (n) { return h.indexOf(n) === 0; })) continue;
          var sec = heads[i].closest('section.page-section');
          if (sec && !sec.id) { sec.id = idOf(a); return; }
        }
      });
    }

    // Hide links with no section; put the rest in page order.
    function sortLinks() {
      var shown = links.filter(function (a) {
        var ok = !!target(a);
        a.parentNode.style.display = ok ? '' : 'none'; // not [hidden]: a host li{display} beats it
        return ok;
      });
      shown.sort(function (a, b) {
        return target(a).compareDocumentPosition(target(b)) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
      });
      shown.forEach(function (a) { list.appendChild(a.parentNode); });
      wrap.style.display = shown.length < 2 ? 'none' : '';
    }

    // Pin to the top once the nav's own spot has scrolled past.
    function pin() {
      var past = (spacer.classList.contains('vg-pinned') ? spacer : nav).getBoundingClientRect().top < 0;
      if (past) spacer.style.height = nav.offsetHeight + 'px';
      nav.classList.toggle('vg-pinned', past);
      spacer.classList.toggle('vg-pinned', past);
    }

    // Smooth scroll that stops below the pinned nav. Done in JS rather than a global
    // `html{scroll-behavior:smooth}`, which would leak out and change the whole site.
    links.forEach(function (a) {
      a.addEventListener('click', function (e) {
        var t = target(a);
        if (!t) return;
        e.preventDefault();
        var start = window.pageYOffset;
        var top = t.getBoundingClientRect().top + start - nav.offsetHeight - 8;
        window.scrollTo({ top: top, behavior: (reduce && reduce.matches) ? 'auto' : 'smooth' });
        // Some browsers drop a smooth scroll (seen in Chrome's phone emulation); jump instead.
        setTimeout(function () {
          if (window.pageYOffset === start && Math.abs(top - start) > 2) window.scrollTo(0, top);
        }, 400);
        history.replaceState(null, '', '#' + idOf(a));
      });
    });

    var visible = {};
    var observer;
    function setActive() {
      var current = null;
      // the LAST section in the activation band: the incoming one is where the reader is
      links.forEach(function (a) {
        var t = target(a);
        if (t && visible[t.id] && (!current || t.getBoundingClientRect().top > current.getBoundingClientRect().top)) current = t;
      });
      links.forEach(function (a) {
        var on = !!current && idOf(a) === current.id;
        a.classList.toggle('vg-active', on);
        // on a phone the list scrolls sideways: keep the highlighted link in view
        if (!on) return;
        var r = a.getBoundingClientRect(), box = list.getBoundingClientRect();
        if (r.left < box.left) list.scrollLeft += r.left - box.left - 8;
        else if (r.right > box.right) list.scrollLeft += r.right - box.right + 8;
      });
    }
    function spy() {
      if (!('IntersectionObserver' in window)) return;
      if (observer) observer.disconnect();
      visible = {};
      // thin band just under the pinned nav, so the highlight is the section under it
      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          visible[e.target.id] = e.isIntersecting && e.intersectionRect.height > 0;
        });
        setActive();
      }, { rootMargin: '-64px 0px -70% 0px', threshold: 0 });
      links.forEach(function (a) { var t = target(a); if (t) observer.observe(t); });
    }

    // Under the results header, sit between the title and the AP panel: pasted as its own
    // block the nav would land below the whole AP table, thousands of pixels down.
    function tuckUnderTitle() {
      var heads = document.querySelectorAll('.vpm-vg.vg-header .vg-results-top');
      for (var i = heads.length - 1; i >= 0; i--) {
        if (heads[i].compareDocumentPosition(wrap) & Node.DOCUMENT_POSITION_FOLLOWING) {
          wrap.classList.add('vg-nav-in-hero');
          heads[i].parentNode.insertBefore(wrap, heads[i].nextSibling);
          return;
        }
      }
    }

    // The sections live in later blocks, so wire up once the page is parsed.
    function init() {
      tuckUnderTitle();
      claimIds();
      sortLinks();
      spy();
      pin();
      window.addEventListener('scroll', pin, { passive: true });
      window.addEventListener('resize', pin);
    }
    document.addEventListener('vg:results-moved', function () { sortLinks(); spy(); });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
</script>
