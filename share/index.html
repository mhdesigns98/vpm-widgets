<!DOCTYPE html>
<!--
  Share page: one direct link per widget or page build, with enough context that someone who has
  never seen the Widget Lab knows what they're looking at.

    /vpm-widgets/share/?w=feed-rail                     a widget from this repo
    /vpm-widgets/share/?p=voter-guide-2026              a page build
    &note=Looking+for+feedback+on+mobile                optional note shown above the preview
    &view=mobile                                        start at mobile, tablet, desktop (1280px) or wide (1920px)
    &live=https://www.vpm.org/some-page                 already live: swaps the "not live" badge for a link

  Title and summary come from the folder's README.md (the H1 and first paragraph), so there's
  nothing extra to maintain. The preview is the folder's preview.html, else index.html, else
  demo/index.html. widgets/ and pages/ share one GitHub Pages origin, so this one page serves both.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>VPM preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* VPM tokens, copied from tokens.css */
  --vpm-dark-blue:  #003865;
  --vpm-light-blue: #6CACE4;
  --vpm-yellow:     #E0E721;
  --vpm-red:        #EE2737;
  --vpm-black:      #101820;
  --vpm-white:      #FFFFFF;
  --vpm-blue-050:   #EEF4FB;
  --vpm-yellow-200: #F2F5A2;
  --vpm-gray-050:   #F8F9FA;
  --vpm-gray-100:   #F2F3F4;
  --vpm-gray-200:   #E5E7E9;
  --vpm-gray-300:   #D1D3D4;
  --vpm-gray-600:   #5A6470;
  --font-sans:    'Public Sans', 'GT America', 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'IBM Plex Sans Condensed', 'Oswald', 'GT America Condensed', 'Arial Narrow', sans-serif;
  --accent-bar: linear-gradient(90deg,
    var(--vpm-light-blue) 0%,  var(--vpm-light-blue) 30%,
    var(--vpm-yellow)     30%, var(--vpm-yellow)     70%,
    var(--vpm-red)        70%, var(--vpm-red)        100%);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--vpm-black);
  background: var(--vpm-gray-100);
  line-height: 1.5;
}
.sh-accent { height: 5px; background: var(--accent-bar); }

.sh-head { background: var(--vpm-dark-blue); color: var(--vpm-white); padding: 28px 16px 24px; }
.sh-head__inner { max-width: 1280px; margin: 0 auto; }
.sh-eyebrow {
  margin: 0 0 6px;
  font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--vpm-yellow);
}
.sh-title {
  margin: 0 0 10px;
  font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(26px, 3.4vw, 40px); line-height: 1.05; letter-spacing: .01em;
}
.sh-summary { margin: 0; max-width: 68ch; font-size: 16px; color: rgba(255,255,255,.86); }
.sh-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.sh-chip {
  font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: rgba(255,255,255,.12); color: var(--vpm-white);
}
.sh-chip--draft { background: var(--vpm-yellow); color: var(--vpm-black); }

.sh-note {
  max-width: 1280px; margin: 20px auto 0; padding: 14px 16px;
  background: var(--vpm-yellow-200); border-left: 4px solid var(--vpm-yellow);
  font-size: 15px; white-space: pre-line;
}
.sh-note strong { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }

.sh-bar {
  max-width: 1280px; margin: 20px auto 12px; padding: 0 16px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
}
.sh-devices { display: inline-flex; border: 1px solid var(--vpm-gray-300); border-radius: 6px; overflow: hidden; background: var(--vpm-white); }
.sh-devices button {
  font: 600 14px var(--font-sans); padding: 8px 14px; border: 0; background: none; color: var(--vpm-black); cursor: pointer;
}
.sh-devices button + button { border-left: 1px solid var(--vpm-gray-300); }
.sh-devices button[aria-pressed="true"] { background: var(--vpm-dark-blue); color: var(--vpm-white); }
.sh-bar__left { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.sh-scale { font-size: 13px; color: var(--vpm-gray-600); }
.sh-actions { display: flex; gap: 16px; font-size: 14px; }
.sh-actions a, .sh-actions button {
  font: 600 14px var(--font-sans); color: var(--vpm-dark-blue); background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}
:focus-visible { outline: 3px solid var(--vpm-dark-blue); outline-offset: 2px; }
.sh-head :focus-visible { outline-color: var(--vpm-yellow); }
.sh-chip a { color: inherit; text-underline-offset: 2px; }
.sh-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.sh-stage { padding: 0 16px 48px; }
/* The iframe renders at the chosen width (real breakpoints apply) and is scaled down to fit
   when the viewer's screen is narrower. JS sets the sizes; the wrap clips to the scaled box. */
.sh-frame-wrap {
  margin: 0 auto; overflow: hidden; background: var(--vpm-white);
  border: 1px solid var(--vpm-gray-200); box-shadow: 0 8px 24px rgba(16,24,32,.08);
}
.sh-frame { display: block; width: 100%; height: 400px; border: 0; transform-origin: 0 0; }

.sh-error { max-width: 1280px; margin: 32px auto; padding: 24px 16px; font-size: 16px; }
.sh-error code { background: var(--vpm-white); padding: 1px 6px; border-radius: 4px; }
.sh-foot { text-align: center; font-size: 13px; color: var(--vpm-gray-600); padding: 0 16px 32px; }
[hidden] { display: none !important; }
@media (max-width: 600px) { .sh-devices, .sh-scale { display: none; } }
</style>
</head>
<body>
<div class="sh-accent"></div>
<header class="sh-head">
  <div class="sh-head__inner">
    <p class="sh-eyebrow" id="sh-eyebrow">VPM web team · Preview</p>
    <h1 class="sh-title" id="sh-title">Loading…</h1>
    <p class="sh-summary" id="sh-summary"></p>
    <ul class="sh-meta" id="sh-meta">
      <li class="sh-chip sh-chip--draft" id="sh-status">Preview: not live on vpm.org</li>
    </ul>
  </div>
</header>

<aside class="sh-note" id="sh-note" hidden><strong>Note</strong><span id="sh-note-text"></span></aside>

<main id="sh-main" hidden>
  <div class="sh-bar">
    <div class="sh-bar__left">
      <div class="sh-devices" role="group" aria-label="Preview width">
        <button type="button" data-view="wide" aria-pressed="false">Wide</button>
        <button type="button" data-view="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-view="tablet" aria-pressed="false">Tablet</button>
        <button type="button" data-view="mobile" aria-pressed="false">Mobile</button>
      </div>
      <span class="sh-scale" id="sh-scale" aria-live="polite"></span>
    </div>
    <div class="sh-actions">
      <button type="button" id="sh-copy">Copy link</button>
      <a id="sh-open" href="#" target="_blank" rel="noopener">Open on its own</a>
    </div>
  </div>
  <div class="sh-stage">
    <div class="sh-frame-wrap" id="sh-wrap" data-view="desktop">
      <iframe class="sh-frame" id="sh-frame" title="Preview"></iframe>
    </div>
  </div>
</main>

<div class="sh-error" id="sh-error" hidden></div>
<p class="sh-sr" id="sh-announce" role="status"></p>
<p class="sh-foot" id="sh-foot">Shared from the VPM Widget Lab. This is a work-in-progress preview, not the published page.</p>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var kind = params.has("p") ? "page" : "widget";
  var slug = (params.get(kind === "page" ? "p" : "w") || "").trim();
  var $ = function (id) { return document.getElementById(id); };

  function fail(html) {
    $("sh-title").textContent = "Preview not found";
    $("sh-meta").hidden = true;
    $("sh-summary").textContent = "";
    $("sh-error").innerHTML = html;
    $("sh-error").hidden = false;
  }

  // Only plain folder names, so a link can't point anywhere outside widgets/ and pages/.
  if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
    fail("This link is missing the name of what to preview. It should end in <code>?w=widget-name</code> or <code>?p=page-name</code>.");
    return;
  }

  var base = kind === "page"
    ? new URL("../pages/" + slug + "/", location.href)
    : new URL("../widgets/" + slug + "/", location.href);

  function stripMd(s) {
    return s
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/[*_`]+/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function readme(md) {
    var lines = md.split(/\r?\n/);
    var title = "", summary = "", deploy = "";
    var i = 0;
    for (; i < lines.length; i++) {
      var h = lines[i].match(/^#\s+(.+)/);
      if (h) { title = stripMd(h[1]); i++; break; }
    }
    // First prose paragraph after the H1. Works on whole paragraphs, so a paragraph that opens as
    // a list, table, quote, HTML or a "**Label:** value" line is skipped together with its
    // wrapped lines. (Skipping line by line once picked up the second line of a wrapped
    // "**Also seen at:**" entry as the summary.) Headings and code fences are skipped too.
    var para = [], inFence = false;
    function take() {
      if (para.length && !summary &&
          !/^\s*([-*+]\s|\d+\.\s|\||>|<)/.test(para[0]) && !/^\s*\*\*[^*]+:\*\*/.test(para[0])) {
        summary = para.join(" ");
      }
      para = [];
    }
    for (; i < lines.length && !summary; i++) {
      var l = lines[i];
      if (/^\s*```/.test(l)) { take(); inFence = !inFence; continue; }
      if (inFence) continue;
      if (!l.trim() || /^\s*#/.test(l)) { take(); continue; }
      para.push(l.trim());
    }
    take();
    var d = md.match(/deploy target:?\**:?\s*(.+)/i);
    if (d) deploy = stripMd(d[1]).replace(/[.,]$/, "");
    // Only the first sentence: later ones in these READMEs tend to be notes for the team.
    var text = stripMd(summary);
    var first = text.match(/^.+?[.!?](?=\s+[A-Z(]|$)/);
    return { title: title, summary: first ? first[0] : text, deploy: deploy };
  }

  function chip(text) {
    var li = document.createElement("li");
    li.className = "sh-chip";
    li.textContent = text;
    $("sh-meta").appendChild(li);
  }

  // Returns the normalized URL if it's http(s) on vpm.org or a subdomain, otherwise null.
  function vpmUrl(raw) {
    if (!raw) return null;
    var u;
    try { u = new URL(raw); } catch (e) { return null; }
    if (u.protocol !== "https:" && u.protocol !== "http:") return null;
    if (u.username || u.password) return null;
    var host = u.hostname;
    if (host !== "vpm.org" && !host.endsWith(".vpm.org")) return null;
    return u.href;
  }

  async function exists(url) {
    try { return (await fetch(url, { method: "HEAD", cache: "no-store" })).ok; } catch (e) { return false; }
  }

  async function load() {
    var previewUrl = null;
    for (var name of ["preview.html", "index.html", "demo/index.html"]) {
      var u = new URL(name, base).href;
      if (await exists(u)) { previewUrl = u; break; }
    }
    if (!previewUrl) {
      fail("Couldn't find <code>" + slug + "</code>. If it was added recently, it may not be published yet. Previews update a minute or two after changes reach the main branch.");
      return;
    }

    var pretty = slug.replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    var info = { title: pretty, summary: "", deploy: "" };
    try {
      var r = await fetch(new URL("README.md", base).href, { cache: "no-store" });
      if (r.ok) {
        var parsed = readme(await r.text());
        // Some READMEs use the folder name as their H1; the prettified version reads better.
        if (parsed.title && parsed.title !== slug) info.title = parsed.title;
        info.summary = parsed.summary;
        info.deploy = parsed.deploy;
      }
    } catch (e) { /* the preview still works without a README */ }

    document.title = info.title + " · VPM preview";
    $("sh-eyebrow").textContent = "VPM web team · " + (kind === "page" ? "Page preview" : "Widget preview");
    $("sh-title").textContent = info.title;
    $("sh-summary").textContent = info.summary;
    chip(kind === "page" ? "Full page build" : "Reusable widget: can appear on several pages");
    if (info.deploy) chip("Goes into: " + info.deploy);

    // A build that's already published shouldn't be labelled "not live". The badge says "Live on
    // vpm.org", so only accept an http(s) URL whose host really is vpm.org or a subdomain, with no
    // user:pass@ part: a prefix test alone lets https://www.vpm.org@evil.example/ through.
    var live = vpmUrl(params.get("live"));
    if (live) {
      var status = $("sh-status");
      status.className = "sh-chip";
      status.textContent = "Live on vpm.org: ";
      var a = document.createElement("a");
      a.href = live; a.target = "_blank"; a.rel = "noopener"; a.textContent = "view the published version";
      status.appendChild(a);
      $("sh-foot").textContent = "Shared from the VPM Widget Lab. This preview shows the latest version, which may differ from what is published.";
    }

    var note = params.get("note");
    if (note) { $("sh-note-text").textContent = note; $("sh-note").hidden = false; }

    // GitHub Pages lets browsers and its CDN reuse a page for 10 minutes, so a just-merged change
    // could show the old version. A one-off query string forces a fresh copy of the preview page,
    // for the embedded frame and for "Open on its own" alike.
    var freshUrl = previewUrl + (previewUrl.indexOf("?") === -1 ? "?" : "&") + "fresh=" + Date.now();
    $("sh-open").href = freshUrl;
    $("sh-main").hidden = false;
    $("sh-frame").title = "Preview of " + info.title;
    $("sh-frame").src = freshUrl;
    setView(params.get("view") || "desktop");
  }

  // ── Preview width and height ──
  var VIEWS = { wide: 1920, desktop: 1280, tablet: 768, mobile: 390 };
  var frame = $("sh-frame"), wrap = $("sh-wrap");
  var current = "desktop", contentH = 400;

  function layout() {
    var avail = $("sh-main").clientWidth - 32 - 2; // stage padding + wrap border
    var phone = window.innerWidth <= 600;          // too small to scale a desktop layout legibly
    var target = phone ? avail : VIEWS[current];
    var scale = phone ? 1 : Math.min(1, avail / target);
    frame.style.width = target + "px";
    frame.style.height = contentH + "px";
    frame.style.transform = scale < 1 ? "scale(" + scale + ")" : "";
    wrap.style.width = Math.floor(target * scale) + 2 + "px";
    wrap.style.height = Math.ceil(contentH * scale) + 2 + "px";
    $("sh-scale").textContent = phone ? "" : scale < 1
      ? "Shown at " + target + "px wide, scaled to " + Math.round(scale * 100) + "% to fit your screen"
      : target + "px wide";
  }

  function setView(view, fromClick) {
    if (!VIEWS[view]) view = "desktop";
    current = view;
    // Keep the chosen width in the address, so "Copy link" and the browser's own copy both
    // reopen at the width the sender was looking at.
    if (fromClick) {
      var u = new URL(location.href);
      u.searchParams.set("view", view);
      history.replaceState(null, "", u);
    }
    document.querySelectorAll(".sh-devices button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === view));
    });
    layout();
  }
  document.querySelectorAll(".sh-devices button").forEach(function (b) {
    b.addEventListener("click", function () { setView(b.dataset.view, true); });
  });
  window.addEventListener("resize", layout);

  // Height of what's actually on the page, not of the iframe's viewport. scrollHeight never
  // reports less than the viewport, which left short widgets sitting on a tall white box.
  function contentHeight(doc) {
    var win = doc.defaultView, body = doc.body;
    if (!body) return doc.documentElement.scrollHeight;
    var bottom = 0;
    for (var el of body.children) {
      if (/^(SCRIPT|STYLE|TEMPLATE|LINK|META|NOSCRIPT)$/.test(el.tagName)) continue;
      var cs = win.getComputedStyle(el);
      if (cs.display === "none" || cs.position === "fixed") continue;
      var r = el.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      bottom = Math.max(bottom, r.bottom + (parseFloat(cs.marginBottom) || 0));
    }
    if (!bottom) return doc.documentElement.scrollHeight;
    var bcs = win.getComputedStyle(body);
    bottom += (parseFloat(bcs.paddingBottom) || 0) + (parseFloat(bcs.borderBottomWidth) || 0) + (parseFloat(bcs.marginBottom) || 0);
    return Math.ceil(bottom + win.scrollY);
  }

  frame.addEventListener("load", function () {
    var doc;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    var lastDelta = 0, sameDelta = 0, queued = false;
    function fit() {
      queued = false;
      var h = Math.max(40, contentHeight(doc));
      var delta = h - contentH;
      if (Math.abs(delta) < 2) return;
      // Content sized in vh grows with the frame; stop chasing it after a few identical steps.
      sameDelta = delta === lastDelta ? sameDelta + 1 : 0;
      lastDelta = delta;
      if (sameDelta >= 3) return;
      contentH = h;
      layout();
    }
    function schedule() { if (!queued) { queued = true; requestAnimationFrame(fit); } }
    fit();
    // The body and <html> stay as tall as the frame, so watch the top-level content itself.
    // Created from the frame's own window: a ResizeObserver only reports on its own document.
    var RO = doc.defaultView.ResizeObserver;
    var ro = RO ? new RO(schedule) : null;
    function watchChildren() {
      if (ro && doc.body) for (var el of doc.body.children) ro.observe(el);
    }
    if (ro) ro.observe(doc.documentElement);
    watchChildren();
    if (doc.body) new MutationObserver(function () { watchChildren(); schedule(); })
      .observe(doc.body, { childList: true, subtree: true, attributes: true, characterData: true });
    // Images and media finish late; expand/collapse animations finish after the class change.
    ["load", "transitionend", "animationend"].forEach(function (t) { doc.addEventListener(t, schedule, true); });
    if (doc.fonts) doc.fonts.ready.then(schedule);
    setTimeout(schedule, 800);
  });

  // ── Copy link ──
  $("sh-copy").addEventListener("click", async function () {
    var btn = this;
    var msg;
    try { await navigator.clipboard.writeText(location.href); msg = "Copied"; }
    catch (e) { msg = "Copy failed. Use the address bar"; }
    btn.textContent = msg;
    $("sh-announce").textContent = msg === "Copied" ? "Link copied" : msg;
    setTimeout(function () { btn.textContent = "Copy link"; $("sh-announce").textContent = ""; }, 2000);
  });

  load();
})();
</script>
</body>
</html>
