<!DOCTYPE html>
<!--
  Share page: one direct link per widget or page build, with enough context that someone who has
  never seen the Widget Lab knows what they're looking at.

    /vpm-widgets/share/?w=feed-rail                     a widget from this repo
    /vpm-widgets/share/?p=voter-guide-2026              a page build from vpm-pages
    &note=Looking+for+feedback+on+mobile                optional note shown above the preview
    &view=mobile                                        start in mobile (or tablet) width

  Title and summary come from the folder's README.md (the H1 and first paragraph), so there's
  nothing extra to maintain. The preview is the folder's preview.html, or index.html if there
  isn't one. Both repos are on the same GitHub Pages origin, so this one page serves both.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>VPM preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* VPM tokens, copied from tokens.css */
  --vpm-dark-blue:  #003865;
  --vpm-light-blue: #6CACE4;
  --vpm-yellow:     #E0E721;
  --vpm-red:        #EE2737;
  --vpm-black:      #101820;
  --vpm-white:      #FFFFFF;
  --vpm-blue-050:   #EEF4FB;
  --vpm-yellow-200: #F2F5A2;
  --vpm-gray-050:   #F8F9FA;
  --vpm-gray-100:   #F2F3F4;
  --vpm-gray-200:   #E5E7E9;
  --vpm-gray-300:   #D1D3D4;
  --vpm-gray-600:   #5A6470;
  --font-sans:    'Public Sans', 'GT America', 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'IBM Plex Sans Condensed', 'Oswald', 'GT America Condensed', 'Arial Narrow', sans-serif;
  --accent-bar: linear-gradient(90deg,
    var(--vpm-light-blue) 0%,  var(--vpm-light-blue) 30%,
    var(--vpm-yellow)     30%, var(--vpm-yellow)     70%,
    var(--vpm-red)        70%, var(--vpm-red)        100%);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--vpm-black);
  background: var(--vpm-gray-100);
  line-height: 1.5;
}
.sh-accent { height: 5px; background: var(--accent-bar); }

.sh-head { background: var(--vpm-dark-blue); color: var(--vpm-white); padding: 28px 16px 24px; }
.sh-head__inner { max-width: 1100px; margin: 0 auto; }
.sh-eyebrow {
  margin: 0 0 6px;
  font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--vpm-yellow);
}
.sh-title {
  margin: 0 0 10px;
  font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(26px, 3.4vw, 40px); line-height: 1.05; letter-spacing: .01em;
}
.sh-summary { margin: 0; max-width: 68ch; font-size: 16px; color: rgba(255,255,255,.86); }
.sh-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.sh-chip {
  font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: rgba(255,255,255,.12); color: var(--vpm-white);
}
.sh-chip--draft { background: var(--vpm-yellow); color: var(--vpm-black); }

.sh-note {
  max-width: 1100px; margin: 20px auto 0; padding: 14px 16px;
  background: var(--vpm-yellow-200); border-left: 4px solid var(--vpm-yellow);
  font-size: 15px; white-space: pre-line;
}
.sh-note strong { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }

.sh-bar {
  max-width: 1100px; margin: 20px auto 12px; padding: 0 16px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
}
.sh-devices { display: inline-flex; border: 1px solid var(--vpm-gray-300); border-radius: 6px; overflow: hidden; background: var(--vpm-white); }
.sh-devices button {
  font: 600 14px var(--font-sans); padding: 8px 14px; border: 0; background: none; color: var(--vpm-black); cursor: pointer;
}
.sh-devices button + button { border-left: 1px solid var(--vpm-gray-300); }
.sh-devices button[aria-pressed="true"] { background: var(--vpm-dark-blue); color: var(--vpm-white); }
.sh-actions { display: flex; gap: 16px; font-size: 14px; }
.sh-actions a, .sh-actions button {
  font: 600 14px var(--font-sans); color: var(--vpm-dark-blue); background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}
:focus-visible { outline: 3px solid var(--vpm-light-blue); outline-offset: 2px; }

.sh-stage { padding: 0 16px 48px; }
.sh-frame-wrap {
  margin: 0 auto; max-width: 1100px; background: var(--vpm-white);
  border: 1px solid var(--vpm-gray-200); box-shadow: 0 8px 24px rgba(16,24,32,.08);
  transition: max-width .2s ease;
}
.sh-frame-wrap[data-view="tablet"] { max-width: 768px; }
.sh-frame-wrap[data-view="mobile"] { max-width: 390px; }
.sh-frame { display: block; width: 100%; height: 600px; border: 0; }

.sh-error { max-width: 1100px; margin: 32px auto; padding: 24px 16px; font-size: 16px; }
.sh-error code { background: var(--vpm-white); padding: 1px 6px; border-radius: 4px; }
.sh-foot { text-align: center; font-size: 13px; color: var(--vpm-gray-600); padding: 0 16px 32px; }
[hidden] { display: none !important; }
@media (max-width: 600px) { .sh-devices { display: none; } }
@media (prefers-reduced-motion: reduce) { .sh-frame-wrap { transition: none; } }
</style>
</head>
<body>
<div class="sh-accent"></div>
<header class="sh-head">
  <div class="sh-head__inner">
    <p class="sh-eyebrow" id="sh-eyebrow">VPM web team · Preview</p>
    <h1 class="sh-title" id="sh-title">Loading…</h1>
    <p class="sh-summary" id="sh-summary"></p>
    <ul class="sh-meta" id="sh-meta">
      <li class="sh-chip sh-chip--draft">Preview: not live on vpm.org</li>
    </ul>
  </div>
</header>

<aside class="sh-note" id="sh-note" hidden><strong>Note</strong><span id="sh-note-text"></span></aside>

<main id="sh-main" hidden>
  <div class="sh-bar">
    <div class="sh-devices" role="group" aria-label="Preview width">
      <button type="button" data-view="desktop" aria-pressed="true">Desktop</button>
      <button type="button" data-view="tablet" aria-pressed="false">Tablet</button>
      <button type="button" data-view="mobile" aria-pressed="false">Mobile</button>
    </div>
    <div class="sh-actions">
      <button type="button" id="sh-copy">Copy link</button>
      <a id="sh-open" href="#" target="_blank" rel="noopener">Open on its own</a>
    </div>
  </div>
  <div class="sh-stage">
    <div class="sh-frame-wrap" id="sh-wrap" data-view="desktop">
      <iframe class="sh-frame" id="sh-frame" title="Preview"></iframe>
    </div>
  </div>
</main>

<div class="sh-error" id="sh-error" hidden></div>
<p class="sh-foot">Shared from the VPM Widget Lab. This is a work-in-progress preview, not the published page.</p>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var kind = params.has("p") ? "page" : "widget";
  var slug = (params.get(kind === "page" ? "p" : "w") || "").trim();
  var $ = function (id) { return document.getElementById(id); };

  function fail(html) {
    $("sh-title").textContent = "Preview not found";
    $("sh-meta").hidden = true;
    $("sh-summary").textContent = "";
    $("sh-error").innerHTML = html;
    $("sh-error").hidden = false;
  }

  // Only plain folder names, so a link can't point anywhere outside the two repos.
  if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
    fail("This link is missing the name of what to preview. It should end in <code>?w=widget-name</code> or <code>?p=page-name</code>.");
    return;
  }

  var base = kind === "page"
    ? new URL("../../vpm-pages/pages/" + slug + "/", location.href)
    : new URL("../widgets/" + slug + "/", location.href);

  function stripMd(s) {
    return s
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/[*_`]+/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function readme(md) {
    var lines = md.split(/\r?\n/);
    var title = "", summary = [], deploy = "";
    var i = 0;
    for (; i < lines.length; i++) {
      var h = lines[i].match(/^#\s+(.+)/);
      if (h) { title = stripMd(h[1]); i++; break; }
    }
    // First prose paragraph after the H1: skip blanks, headings, lists, tables, quotes, code.
    for (; i < lines.length; i++) {
      var l = lines[i];
      if (!l.trim()) { if (summary.length) break; continue; }
      if (/^\s*(#|[-*+]\s|\d+\.\s|\||>|```|<)/.test(l) || /^\s*\*\*[^*]+:\*\*/.test(l)) { if (summary.length) break; continue; }
      summary.push(l.trim());
    }
    var d = md.match(/deploy target:?\**:?\s*(.+)/i);
    if (d) deploy = stripMd(d[1]).replace(/[.,]$/, "");
    // Only the first sentence: later ones in these READMEs tend to be notes for the team.
    var text = stripMd(summary.join(" "));
    var first = text.match(/^.+?[.!?](?=\s+[A-Z(]|$)/);
    return { title: title, summary: first ? first[0] : text, deploy: deploy };
  }

  function chip(text) {
    var li = document.createElement("li");
    li.className = "sh-chip";
    li.textContent = text;
    $("sh-meta").appendChild(li);
  }

  async function exists(url) {
    try { return (await fetch(url, { method: "HEAD", cache: "no-store" })).ok; } catch (e) { return false; }
  }

  async function load() {
    var previewUrl = null;
    for (var name of ["preview.html", "index.html"]) {
      var u = new URL(name, base).href;
      if (await exists(u)) { previewUrl = u; break; }
    }
    if (!previewUrl) {
      fail("Couldn't find <code>" + slug + "</code>. If it was added recently, it may not be published yet. Previews update a minute or two after changes reach the main branch.");
      return;
    }

    var pretty = slug.replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    var info = { title: pretty, summary: "", deploy: "" };
    try {
      var r = await fetch(new URL("README.md", base).href, { cache: "no-store" });
      if (r.ok) {
        var parsed = readme(await r.text());
        // Some READMEs use the folder name as their H1; the prettified version reads better.
        if (parsed.title && parsed.title !== slug) info.title = parsed.title;
        info.summary = parsed.summary;
        info.deploy = parsed.deploy;
      }
    } catch (e) { /* the preview still works without a README */ }

    document.title = info.title + " · VPM preview";
    $("sh-eyebrow").textContent = "VPM web team · " + (kind === "page" ? "Page preview" : "Widget preview");
    $("sh-title").textContent = info.title;
    $("sh-summary").textContent = info.summary;
    chip(kind === "page" ? "Full page build" : "Reusable widget: can appear on several pages");
    if (info.deploy) chip("Goes into: " + info.deploy);

    var note = params.get("note");
    if (note) { $("sh-note-text").textContent = note; $("sh-note").hidden = false; }

    $("sh-open").href = previewUrl;
    $("sh-main").hidden = false;
    $("sh-frame").title = "Preview of " + info.title;
    $("sh-frame").src = previewUrl;
    setView(params.get("view") || "desktop");
  }

  // ── Device widths ──
  function setView(view) {
    if (!/^(desktop|tablet|mobile)$/.test(view)) view = "desktop";
    $("sh-wrap").dataset.view = view;
    document.querySelectorAll(".sh-devices button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === view));
    });
  }
  document.querySelectorAll(".sh-devices button").forEach(function (b) {
    b.addEventListener("click", function () { setView(b.dataset.view); });
  });

  // ── Fit the iframe to its content (same origin, so we can measure it) ──
  var frame = $("sh-frame");
  frame.addEventListener("load", function () {
    var doc;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    var lastDelta = 0, sameDelta = 0;
    function fit() {
      var h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      var delta = h - frame.offsetHeight;
      if (Math.abs(delta) < 2) return;
      // Content sized in vh grows with the frame; stop chasing it after a few identical steps.
      sameDelta = delta === lastDelta ? sameDelta + 1 : 0;
      lastDelta = delta;
      if (sameDelta >= 3) return;
      frame.style.height = Math.max(200, h) + "px";
    }
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(doc.documentElement);
    setTimeout(fit, 800);
  });

  // ── Copy link ──
  $("sh-copy").addEventListener("click", async function () {
    var btn = this;
    try { await navigator.clipboard.writeText(location.href); btn.textContent = "Copied"; }
    catch (e) { btn.textContent = "Copy failed. Use the address bar"; }
    setTimeout(function () { btn.textContent = "Copy link"; }, 2000);
  });

  load();
})();
</script>
</body>
</html>
